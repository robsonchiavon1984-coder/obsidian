<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1e1e1e">
<title>Códex</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4 56 18v28L32 60 8 46V18z' fill='%238a6cf0'/%3E%3Cpath d='M32 14 46 22v20L32 50 18 42V22z' fill='%23fff' opacity='.85'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,700;1,400&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap">
<script src="https://cdn.jsdelivr.net/npm/marked@18.1.1/lib/marked.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"></script>
<style>
:root{
  --bg:#1e1e1e; --bg2:#262626; --bg3:#2f2f2f; --bg4:#363636; --border:#3a3a3a;
  --text:#dcddde; --muted:#999; --faint:#6a6a6a; --accent:#8a6cf0; --accent2:#a48bff;
  --accent-bg:rgba(138,108,240,.18); --link:#a48bff; --unresolved:#7d6aa8;
  --tag:#a48bff; --tag-bg:rgba(138,108,240,.15); --hl:rgba(255,208,0,.35);
  --code-bg:#2a2a2a; --danger:#e5534b; --ok:#4caf50; --warn:#d9a300;
  --shadow:0 8px 30px rgba(0,0,0,.45); --radius:6px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --editor-size:16px; --line-width:760px;
}
:root[data-theme="light"]{
  --bg:#ffffff; --bg2:#f6f6f6; --bg3:#ececec; --bg4:#e2e2e2; --border:#dedede;
  --text:#222; --muted:#666; --faint:#9a9a9a; --accent:#7050e0; --accent2:#5b3cc4;
  --accent-bg:rgba(112,80,224,.12); --link:#5b3cc4; --unresolved:#9a8bc9;
  --tag:#5b3cc4; --tag-bg:rgba(112,80,224,.10); --code-bg:#f2f2f2; --shadow:0 8px 30px rgba(0,0,0,.18);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;overscroll-behavior:none}
body{height:100dvh;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
input,textarea,select{font:inherit;color:var(--text)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}

/* layout */
#app{display:flex;height:calc(100dvh - 24px);width:100vw}
#ribbon{width:44px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;flex:none}
#ribbon .sp{flex:1}
.rb{width:34px;height:34px;border:0;background:none;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer}
.rb:hover{background:var(--bg3);color:var(--text)}
.rb.on{color:var(--accent2)}
aside{background:var(--bg2);display:flex;flex-direction:column;min-width:0;flex:none;position:relative}
#left{width:270px;border-right:1px solid var(--border)}
#right{width:320px;border-left:1px solid var(--border)}
aside.collapsed{display:none}
.resizer{position:absolute;top:0;bottom:0;width:6px;cursor:col-resize;z-index:5}
#left .resizer{right:-3px} #right .resizer{left:-3px}
.side-tabs{display:flex;gap:2px;padding:6px 6px 0;border-bottom:1px solid var(--border);flex:none}
.side-tab{border:0;background:none;padding:6px 8px;border-radius:6px 6px 0 0;cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:4px}
.side-tab.on{color:var(--text);background:var(--bg3)}
.side-tab:hover{color:var(--text)}
.side-body{flex:1;overflow:auto;min-height:0}
.pane{display:none;height:100%;flex-direction:column}
.pane.on{display:flex}
.pane-head{display:flex;align-items:center;gap:2px;padding:6px 8px;border-bottom:1px solid var(--border);flex:none}
.pane-head .title{flex:1;font-weight:600;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.ib{border:0;background:none;width:28px;height:28px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;flex:none}
.ib:hover{background:var(--bg3);color:var(--text)}
.ib.on{color:var(--accent2);background:var(--accent-bg)}
.ib svg.i{width:16px;height:16px}
.pane-scroll{flex:1;overflow:auto;padding:4px 0 40px;min-height:0}

/* tree */
.tree-item{display:flex;align-items:center;gap:4px;padding:3px 8px;margin:0 4px;border-radius:5px;cursor:pointer;white-space:nowrap;color:var(--text);user-select:none;-webkit-user-select:none;min-height:26px}
.tree-item:hover{background:var(--bg3)}
.tree-item.active{background:var(--accent-bg);color:var(--accent2)}
.tree-item.drop{outline:1px dashed var(--accent)}
.tree-item .chev{width:14px;display:inline-flex;color:var(--faint);transition:transform .12s}
.tree-item .chev svg.i{width:13px;height:13px}
.tree-item.open>.chev{transform:rotate(90deg)}
.tree-item .nm{overflow:hidden;text-overflow:ellipsis;flex:1}
.tree-item .ext{font-size:10px;color:var(--faint);border:1px solid var(--border);border-radius:3px;padding:0 3px}
.tree-folder{font-weight:500}
.tree-children{margin-left:12px;border-left:1px solid var(--border)}

/* center */
#center{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
#tabbar{display:flex;align-items:flex-end;background:var(--bg2);border-bottom:1px solid var(--border);height:38px;flex:none;overflow-x:auto;scrollbar-width:none;padding:0 4px}
#tabbar::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 10px;max-width:220px;min-width:90px;border-radius:7px 7px 0 0;cursor:pointer;color:var(--muted);flex:none}
.tab:hover{background:var(--bg3)}
.tab.on{background:var(--bg);color:var(--text)}
.tab .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .x{opacity:.5;width:20px;height:20px}
.tab .dirty::after{content:"•";color:var(--accent2);margin-left:2px}
#tabbar .newtab{margin:0 0 3px 4px}
#views{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
.view-head{display:flex;align-items:center;gap:4px;padding:4px 10px;flex:none;min-height:36px}
.view-head .crumb{flex:1;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.view-head .crumb b{color:var(--text);font-weight:500}
.view-body{flex:1;min-height:0;display:flex}
.view-body>*{min-width:0}

/* editor */
.ed-wrap{flex:1;overflow:auto;display:flex;justify-content:center}
.ed{width:100%;max-width:var(--line-width);min-height:100%;padding:24px 28px 50vh;border:0;outline:none;resize:none;background:transparent;color:var(--text);font-family:var(--text-font,var(--font));font-size:var(--editor-size);line-height:1.65;tab-size:4;overflow:hidden}
.ed.mono{font-family:var(--mono);font-size:calc(var(--editor-size) - 1px)}
.ed-stack{position:relative;width:100%;max-width:var(--line-width)}
.ed-stack .ed{max-width:none;position:relative;z-index:1}
.ed-hl{position:absolute;inset:0;padding:24px 28px 50vh;font-family:var(--text-font,var(--font));font-size:var(--editor-size);line-height:1.65;tab-size:4;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:break-word;color:var(--text);pointer-events:none;overflow:hidden}
.ed.hl-on{color:transparent;caret-color:var(--text);-webkit-text-fill-color:transparent}
.ed.hl-on::selection{background:rgba(138,108,240,.35);-webkit-text-fill-color:transparent}
.ed.mono~.ed-hl,.ed-stack:has(.ed.mono) .ed-hl{font-family:var(--mono);font-size:calc(var(--editor-size) - 1px)}
.m-faint{color:var(--faint)} .m-h{color:var(--text);text-shadow:.45px 0 0 currentColor,-.2px 0 0 currentColor}
.m-h1{color:var(--accent2)} .m-h2{color:#c9b8ff} :root[data-theme="light"] .m-h2{color:#4a33b0}
.m-b{text-shadow:.45px 0 0 currentColor} .m-i{color:#d8c690} :root[data-theme="light"] .m-i{color:#8a6a00}
.m-link{color:var(--link)} .m-url{color:var(--link);text-decoration:underline;text-decoration-color:var(--faint)}
.m-tag{color:var(--tag)} .m-hl{background:var(--hl);border-radius:2px} .m-del{text-decoration:line-through;color:var(--muted)}
.m-code,.m-codeblk{color:#e6a26a;background:var(--code-bg);border-radius:3px} :root[data-theme="light"] .m-code,:root[data-theme="light"] .m-codeblk{color:#b4501b}
.m-quote{color:var(--accent)} .m-callout{color:var(--accent2)} .m-list{color:var(--accent2)} .m-done{color:var(--muted);text-decoration:line-through}
.m-fm{color:var(--muted)}
.title-input{width:100%;max-width:var(--line-width);border:0;outline:none;background:transparent;font-size:calc(var(--editor-size) * 1.9);font-weight:700;padding:28px 28px 0;color:var(--text)}
.ed-col{display:flex;flex-direction:column;align-items:center;width:100%}
.split .ed-wrap,.split .reader{flex:1 1 50%}
.split .reader{border-left:1px solid var(--border)}

/* reader */
.reader{flex:1;overflow:auto;display:flex;justify-content:center}
.md{width:100%;max-width:var(--line-width);padding:24px 28px 50vh;font-family:var(--text-font,var(--font));font-size:var(--editor-size);line-height:1.7;word-wrap:break-word}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{line-height:1.3;margin:1.3em 0 .5em;font-weight:700}
.md h1{font-size:1.9em}.md h2{font-size:1.55em}.md h3{font-size:1.3em}.md h4{font-size:1.12em}
.md .inline-title{font-size:1.9em;font-weight:700;margin:.3em 0 .6em}
.md p{margin:.6em 0}
.md a{color:var(--link);text-decoration:none}
.md a:hover{text-decoration:underline}
.md a.internal-link{cursor:pointer}
.md a.internal-link.unresolved{color:var(--unresolved);opacity:.85;text-decoration:underline dotted}
.md a.tag{background:var(--tag-bg);color:var(--tag);padding:1px 7px;border-radius:12px;font-size:.88em;cursor:pointer}
.md mark{background:var(--hl);color:inherit;padding:0 2px;border-radius:2px}
.md code{font-family:var(--mono);background:var(--code-bg);padding:1px 5px;border-radius:4px;font-size:.88em}
.md pre{background:var(--code-bg);padding:12px 14px;border-radius:6px;overflow:auto}
.md pre code{background:none;padding:0}
.md blockquote{margin:.8em 0;padding:2px 16px;border-left:3px solid var(--accent);color:var(--muted)}
.md table{border-collapse:collapse;margin:1em 0;display:block;overflow:auto}
.md th,.md td{border:1px solid var(--border);padding:6px 10px}
.md th{background:var(--bg2)}
.md img{max-width:100%;border-radius:4px}
.md hr{border:0;border-top:1px solid var(--border);margin:2em 0}
.md ul,.md ol{padding-left:1.6em}
.md li.task{list-style:none;margin-left:-1.4em}
.md li.task input{margin-right:8px;transform:scale(1.15);accent-color:var(--accent)}
.md li.task.done>span.tt{text-decoration:line-through;color:var(--muted)}
.md .props{border:1px solid var(--border);border-radius:6px;margin:0 0 1.2em;font-size:.85em}
.md .props div{display:flex;padding:4px 10px;border-bottom:1px solid var(--border)}
.md .props div:last-child{border:0}
.md .props b{width:130px;color:var(--muted);font-weight:500;flex:none}
.callout{border-radius:6px;padding:10px 14px;margin:1em 0;background:rgba(80,120,230,.10);border-left:4px solid #5a82e6}
.callout-title{font-weight:600;display:flex;align-items:center;gap:6px;cursor:default}
.callout.foldable .callout-title{cursor:pointer}
.callout.folded .callout-content{display:none}
.callout-content>:first-child{margin-top:.4em}
.callout-content>:last-child{margin-bottom:0}
.callout[data-c="warning"],.callout[data-c="atencao"],.callout[data-c="caution"]{background:rgba(230,150,30,.12);border-color:#e6961e}
.callout[data-c="danger"],.callout[data-c="error"],.callout[data-c="bug"],.callout[data-c="perigo"]{background:rgba(230,70,70,.12);border-color:#e64646}
.callout[data-c="tip"],.callout[data-c="success"],.callout[data-c="dica"],.callout[data-c="check"]{background:rgba(60,180,110,.12);border-color:#3cb46e}
.callout[data-c="question"],.callout[data-c="faq"],.callout[data-c="pergunta"]{background:rgba(220,190,40,.12);border-color:#d4b51e}
.callout[data-c="quote"],.callout[data-c="cite"],.callout[data-c="citacao"]{background:rgba(150,150,150,.12);border-color:#999}
.callout[data-c="example"],.callout[data-c="exemplo"],.callout[data-c="lei"]{background:rgba(140,100,240,.12);border-color:#8c64f0}
.embed{border-left:2px solid var(--accent);padding:4px 0 4px 14px;margin:1em 0}
.embed-title{font-size:.8em;color:var(--muted);margin-bottom:4px;display:flex;gap:6px;align-items:center}
.embed-title a{color:var(--muted)}
.embed-pdf{border:1px solid var(--border);border-radius:6px;margin:1em 0;overflow:hidden}
.embed-pdf .bar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg2);font-size:13px}
.embed-pdf .bar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.embed-pdf .pages{max-height:620px;overflow:auto;background:#555;padding:8px;display:flex;flex-direction:column;align-items:center;gap:8px}
.embed-pdf canvas{max-width:100%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.yt{position:relative;width:100%;aspect-ratio:16/9;margin:1em 0}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:6px}
.missing-embed{color:var(--unresolved);font-style:italic}

/* buttons */
.btn{border:1px solid var(--border);background:var(--bg3);padding:7px 14px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--bg4)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
input.txt,textarea.txt,select.txt{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px 10px;width:100%;outline:none}
input.txt:focus,textarea.txt:focus,select.txt:focus{border-color:var(--accent)}

/* status */
#statusbar{height:24px;display:flex;align-items:center;justify-content:flex-end;gap:16px;padding:0 12px;font-size:12px;color:var(--muted);background:var(--bg2);border-top:1px solid var(--border)}
#statusbar .l{margin-right:auto;display:flex;gap:6px;align-items:center}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding-top:10vh}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);width:min(560px,94vw);max-height:80vh;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{width:min(860px,96vw)}
.modal h3{margin:0;padding:14px 18px 8px;font-size:16px}
.modal .mbody{padding:8px 18px 14px;overflow:auto}
.modal .mfoot{display:flex;justify-content:flex-end;gap:8px;padding:10px 18px 14px;border-top:1px solid var(--border)}
.pal-input{border:0;border-bottom:1px solid var(--border);background:transparent;padding:14px 16px;font-size:16px;outline:none;width:100%}
.pal-list{overflow:auto;max-height:55vh;padding:4px}
.pal-item{padding:8px 12px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:10px}
.pal-item .sub{color:var(--faint);font-size:12px;margin-left:auto;white-space:nowrap}
.pal-item .main{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-item.sel{background:var(--accent-bg)}
.pal-item em{font-style:normal;color:var(--accent2);font-weight:600}
.pal-hint{padding:6px 14px;font-size:12px;color:var(--faint);border-top:1px solid var(--border)}
.menu{position:fixed;z-index:200;background:var(--bg2);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:4px;min-width:200px}
.menu .mi{padding:7px 12px;border-radius:5px;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
.menu .mi:hover{background:var(--accent-bg)}
.menu .mi.danger{color:var(--danger)}
.menu .sep{height:1px;background:var(--border);margin:4px 0}
#toasts{position:fixed;right:16px;bottom:36px;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--bg3);border:1px solid var(--border);padding:9px 14px;border-radius:8px;box-shadow:var(--shadow);max-width:380px;animation:tin .15s}
.toast.err{border-color:var(--danger)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
.suggest{position:fixed;z-index:150;background:var(--bg2);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);max-height:260px;overflow:auto;min-width:260px;max-width:420px;padding:4px}
.popover{position:fixed;z-index:140;width:440px;max-height:360px;overflow:auto;background:var(--bg);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow)}
.popover .md{padding:12px 18px;font-size:14px}

/* side panes */
.list-sec{padding:8px 12px 2px;color:var(--muted);font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.bl-file{margin:2px 6px;border-radius:6px}
.bl-file .fn{padding:5px 8px;cursor:pointer;font-weight:500;border-radius:5px;display:flex;gap:6px;align-items:center}
.bl-file .fn:hover{background:var(--bg3)}
.bl-snip{margin:2px 8px 6px 22px;padding:6px 8px;font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:5px;cursor:pointer;line-height:1.45}
.bl-snip mark{background:var(--accent-bg);color:var(--accent2)}
.empty{padding:16px;color:var(--faint);font-size:13px;line-height:1.5}
.outline-item{padding:4px 10px;cursor:pointer;border-radius:5px;margin:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.outline-item:hover{background:var(--bg3)}
.tag-row{display:flex;padding:4px 12px;cursor:pointer;margin:0 6px;border-radius:5px}
.tag-row:hover{background:var(--bg3)}
.tag-row span{flex:1;color:var(--tag)}
.tag-row i{font-style:normal;color:var(--faint);font-size:12px}
.search-box{padding:8px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--border)}
.search-opts{display:flex;gap:10px;font-size:12px;color:var(--muted)}
.search-opts label{display:flex;gap:4px;align-items:center;cursor:pointer}

/* welcome */
#welcome{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto;display:flex;justify-content:center}
.wl{max-width:860px;width:100%;padding:6vh 20px 40px}
.wl h1{font-size:30px;margin:0 0 6px}
.wl p.sub{color:var(--muted);margin:0 0 28px;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{border:1px solid var(--border);background:var(--bg2);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:16px;display:flex;gap:8px;align-items:center}
.card p{margin:0;color:var(--muted);line-height:1.5;font-size:13.5px;flex:1}
.card .note{font-size:12px;color:var(--warn)}
.recent{margin-top:28px}
.recent h4{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.recent .r{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;background:var(--bg2)}
.recent .r:hover{border-color:var(--accent)}
.recent .r span{flex:1}
.recent .r small{color:var(--faint)}

/* settings */
.set-row{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--border);align-items:center}
.set-row .lbl{flex:1}
.set-row .lbl b{display:block;font-weight:500;margin-bottom:2px}
.set-row .lbl small{color:var(--muted);line-height:1.4;display:block}
.set-row .ctl{width:280px;flex:none}
.set-sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent2);margin:18px 0 0;font-weight:700}
.switch{position:relative;width:40px;height:22px;flex:none;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--bg4);border-radius:11px;cursor:pointer;transition:.15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{left:21px}

/* graph */
.graph-wrap{flex:1;position:relative;overflow:hidden;background:var(--bg)}
.graph-wrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.graph-ctl{position:absolute;top:10px;right:10px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px;width:230px;display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.graph-ctl label{display:flex;justify-content:space-between;align-items:center;gap:8px}
.graph-ctl input[type=range]{width:110px}

/* PDF annotator */
.pdfv{flex:1;display:flex;flex-direction:column;min-height:0;background:#4a4a4a}
:root[data-theme="light"] .pdfv{background:#c9c9cc}
.pdf-tb{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:6px 8px;background:var(--bg2);border-bottom:1px solid var(--border);flex:none}
.pdf-tb .grp{display:flex;align-items:center;gap:2px;padding-right:6px;margin-right:4px;border-right:1px solid var(--border)}
.pdf-tb .grp:last-child{border:0}
.pdf-tb .ib{width:36px;height:36px}
.pdf-tb .ib svg.i{width:19px;height:19px}
.swatch{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;margin:0 2px;flex:none}
.swatch.on{border-color:var(--text);box-shadow:0 0 0 2px var(--bg2) inset}
.wbtn{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:0;background:none}
.wbtn.on{background:var(--accent-bg)}
.wbtn i{display:block;background:var(--text);border-radius:4px;width:16px}
.pdf-main{flex:1;display:flex;min-height:0}
.pdf-thumbs{width:150px;overflow:auto;background:var(--bg2);border-right:1px solid var(--border);padding:8px;display:flex;flex-direction:column;gap:10px;align-items:center;flex:none}
.pdf-thumbs .th{cursor:pointer;text-align:center;font-size:11px;color:var(--muted)}
.pdf-thumbs .th canvas{width:110px;background:#fff;display:block;margin-bottom:2px;border:2px solid transparent}
.pdf-thumbs .th.on canvas{border-color:var(--accent)}
.pdf-scroll{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
.pdf-pages{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px;min-width:min-content}
.pg{position:relative;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35);flex:none}
.pg canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.pg .ink,.pg .live{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pg .textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;opacity:1;-webkit-text-size-adjust:none;text-size-adjust:none;forced-color-adjust:none}
.pg .textLayer span,.pg .textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0}
.pg .textLayer ::selection{background:rgba(0,100,255,.3)}
.pg .textLayer .hit{background:rgba(255,200,0,.45);border-radius:2px}
.pg .pgnum{position:absolute;bottom:-18px;right:0;font-size:11px;color:#ddd}
.pdfv[data-tool="select"] .live,.pdfv[data-tool="select"] .ink{pointer-events:none}
.pdfv:not([data-tool="select"]) .textLayer{pointer-events:none}
.pdfv[data-tool="hand"] .live{pointer-events:none}
.pdfv[data-tool="hand"] .textLayer{pointer-events:none}
.pdfv[data-tool="pen"] .live,.pdfv[data-tool="hl"] .live,.pdfv[data-tool="line"] .live,.pdfv[data-tool="rect"] .live,.pdfv[data-tool="arrow"] .live{cursor:crosshair}
.pdfv[data-tool="eraser"] .live{cursor:cell}
.pdfv[data-tool="text"] .live{cursor:text}
.pdf-find{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--bg2);border-bottom:1px solid var(--border)}
.pdf-find input{max-width:260px}
.pdf-find span{color:var(--muted);font-size:12px}
.sel-pop{position:fixed;z-index:160;background:var(--bg2);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);display:flex;padding:3px;gap:2px}
.sel-pop button{border:0;background:none;padding:6px 10px;border-radius:5px;cursor:pointer;font-size:13px}
.sel-pop button:hover{background:var(--accent-bg)}
.text-edit{position:absolute;z-index:5;min-width:120px;min-height:28px;border:1px dashed var(--accent);background:rgba(255,255,255,.9);color:#111;outline:none;padding:2px 4px;font-family:var(--font);white-space:pre-wrap}
.zoomlbl{min-width:46px;text-align:center;font-size:12px;color:var(--muted)}

/* gemini */
.ai{display:flex;flex-direction:column;height:100%}
.ai-warn{margin:8px;padding:8px 10px;font-size:12px;line-height:1.45;border-radius:6px;background:rgba(217,163,0,.12);border:1px solid rgba(217,163,0,.4);color:var(--text)}
.ai-msgs{flex:1;overflow:auto;padding:8px 10px;display:flex;flex-direction:column;gap:10px;min-height:0}
.msg{border-radius:8px;padding:8px 11px;line-height:1.55;font-size:13.5px;max-width:100%}
.msg.user{background:var(--accent-bg);align-self:flex-end;white-space:pre-wrap;max-width:92%}
.msg.model{background:var(--bg3)}
.msg.model .md{padding:0;font-size:13.5px;max-width:none}
.msg.model .md>:first-child{margin-top:0}.msg.model .md>:last-child{margin-bottom:0}
.msg.tool{font-size:12px;color:var(--muted);background:none;border:1px dashed var(--border);padding:5px 9px}
.msg.err{background:rgba(229,83,75,.12);color:var(--danger)}
.msg .acts{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.ai-ctx{display:flex;flex-wrap:wrap;gap:5px;padding:6px 10px 0}
.chip{border:1px solid var(--border);border-radius:12px;padding:2px 9px;font-size:12px;cursor:pointer;background:none;display:inline-flex;align-items:center;gap:4px}
.chip.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent2)}
.ai-quick{display:flex;gap:5px;padding:6px 10px;overflow-x:auto;flex:none;scrollbar-width:thin}
.ai-quick .chip{white-space:nowrap;flex:none}
.msg.tool svg.i{width:13px;height:13px;vertical-align:-2px}
.ai-in{display:flex;gap:6px;padding:8px 10px 10px;align-items:flex-end;border-top:1px solid var(--border);flex:none}
.ai-in textarea{flex:1;resize:none;max-height:180px;min-height:40px}
.typing{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.ai-files{display:flex;flex-wrap:wrap;gap:4px;padding:0 10px}
.diff{font-family:var(--mono);font-size:12px;white-space:pre-wrap;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px;max-height:45vh;overflow:auto}

/* responsive */
@media (max-width:900px){
  #left,#right{position:fixed;top:0;bottom:24px;z-index:60;box-shadow:var(--shadow)}

  #right{right:0;width:min(380px,90vw)}
  .ed,.md{padding-left:18px;padding-right:18px}

.ed-stack .ed{max-width:none;position:relative;z-index:1}
.ed-hl{position:absolute;inset:0;padding:24px 28px 50vh;font-family:var(--text-font,var(--font));font-size:var(--editor-size);line-height:1.65;tab-size:4;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:break-word;color:var(--text);pointer-events:none;overflow:hidden}
.ed.hl-on{color:transparent;caret-color:var(--text);-webkit-text-fill-color:transparent}

.ed.mono~.ed-hl,.ed-stack:has(.ed.mono) .ed-hl{font-family:var(--mono);font-size:calc(var(--editor-size) - 1px)}

.m-link{color:var(--link)} .m-url{color:var(--link);text-decoration:underline;text-decoration-color:var(--faint)}
.m-tag{color:var(--tag)} .m-hl{background:var(--hl);border-radius:2px} .m-del{text-decoration:line-through;color:var(--muted)}
.m-code,.m-codeblk{color:#e6a26a;background:var(--code-bg);border-radius:3px} :root[data-theme="light"] .m-code,:root[data-theme="light"] .m-codeblk{color:#b4501b}
.m-quote{color:var(--accent)} .m-callout{color:var(--accent2)} .m-list{color:var(--accent2)} .m-done{color:var(--muted);text-decoration:line-through}
.m-fm{color:var(--muted)}
.title-input{padding-left:18px;padding-right:18px}
  .set-row{flex-direction:column;align-items:stretch}
  .set-row .ctl{width:100%}
  .graph-ctl{width:190px}
}
@media (pointer:coarse){
  .tree-item{min-height:34px}
  .ib{width:34px;height:34px}
}
@media print{
  #ribbon,#left,#right,#tabbar,#statusbar,.view-head{display:none!important}
}

:root.justify .md p,:root.justify .md li,:root.justify .md blockquote,:root.justify .md .callout-content,:root.justify .md td{text-align:justify;-webkit-hyphens:auto;hyphens:auto}
:root.ed-justify .ed,:root.ed-justify .ed-hl{text-align:justify}
.md [style*="text-align"] p,.md [style*="text-align"] li{text-align:inherit!important}
.md mark[style]{color:#111}
.md u{text-decoration-thickness:1px;text-underline-offset:2px}
.m-tagh{color:var(--faint);opacity:.75}
/* barra de formatação */
.fmt-bar{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:4px 10px;border-bottom:1px solid var(--border);background:var(--bg);flex:none}
.fmt-bar::-webkit-scrollbar{display:none}
.fb{border:0;background:none;min-width:32px;height:32px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:1px;color:var(--text);cursor:pointer;flex:none;padding:0 5px}
.fb:hover{background:var(--bg3)}
.fb .ft{font-size:16px;font-family:Georgia,"Times New Roman",serif}
.fb svg.i{width:17px;height:17px}
.fb svg.i.mini{width:11px;height:11px;color:var(--faint)}

.fsel{background:var(--bg2);border:1px solid var(--border);border-radius:6px;height:30px;padding:0 6px;margin:0 2px;flex:none;max-width:140px;cursor:pointer}
.fmt-pop{position:fixed;z-index:210;background:var(--bg2);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:8px;min-width:180px;display:flex;flex-direction:column;gap:6px}
.fsw-grid{display:grid;grid-template-columns:repeat(5,28px);gap:6px}
.fsw{width:28px;height:28px;border-radius:6px;border:1px solid rgba(0,0,0,.25);cursor:pointer}
.fsw:hover{outline:2px solid var(--accent)}
.fmt-auto,.fmt-item{border:0;background:none;text-align:left;padding:6px 8px;border-radius:5px;cursor:pointer;color:var(--text)}
.fmt-auto:hover,.fmt-item:hover{background:var(--accent-bg)}
.fmt-custom{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;padding:2px 4px}
.fmt-custom input{width:28px;height:28px;border:0;padding:0;background:none}
@media print{.fmt-bar{display:none!important}}
.m-mk{background:color-mix(in srgb,var(--mk) 55%,transparent);border-radius:2px}

.ai-model-box{min-width:0;flex:1 1 auto;display:flex}
.ai-model{max-width:100%;padding:3px 6px;font-size:12px;height:28px}

class LocalVault {
  constructor(handle) { this.kind = 'local'; this.handle = handle; this.name = handle.name; this.id = 'local:' + handle.name; }

  }
  async list() {
    const out = [];
    const walk = async (dir, prefix) => {
      for await (const [name, h] of dir.entries()) {
        const p = joinP(prefix, name);
        if (h.kind === 'directory') { if (IGNORE_DIRS.has(name)) continue; out.push({ path: p, type: 'folder' }); await walk(h, p); }
        else { let mtime = 0, size = 0; try { const f = await h.getFile(); mtime = f.lastModified; size = f.size; } catch (e) { } out.push({ path: p, type: 'file', mtime, size }); }
      }

  }
  async _dir(path, create) { let d = this.handle; for (const part of path.split('/').filter(Boolean)) d = await d.getDirectoryHandle(part, { create }); return d; }
  async _file(p, create) { const d = await this._dir(dirOf(p), create); return d.getFileHandle(baseOf(p), { create }); }
  async read(p) { return (await (await this._file(p)).getFile()).text(); }
  async readBinary(p) { const f = await (await this._file(p)).getFile(); return f; }
  async exists(p) { try { await this._file(p); return true; } catch (e) { try { await this._dir(p); return true; } catch (e2) { return false; } } }
  async write(p, data) { const fh = await this._file(p, true); const w = await fh.createWritable(); await w.write(data); await w.close(); }
  async mkdir(p) { await this._dir(p, true); }
  async _isDir(p) { try { await this._dir(p); return true; } catch (e) { return false; } }
  async _copy(from, to) {
    if (await this._isDir(from)) {
      await this.mkdir(to); const d = await this._dir(from);
      for await (const [name] of d.entries()) await this._copy(joinP(from, name), joinP(to, name));
    } else { const b = await this.readBinary(from); await this.write(to, b); }
  }
  async _delete(p) { const d = await this._dir(dirOf(p)); await d.removeEntry(baseOf(p), { recursive: true }); }
  async rename(from, to) {
    if (!(await this._isDir(from)) && dirOf(from) === dirOf(to)) {
      try { const fh = await this._file(from); if (fh.move) { await fh.move(baseOf(to)); return; } } catch (e) { }
    }
    await this._copy(from, to); await this._delete(from);
  }
  async remove(p) { // lixeira do cofre (.trash), como no Obsidian
    let dest = joinP('.trash', p);

  }
}

const CALLOUT_TITLES = { note: 'Nota', info: 'Informação', tip: 'Dica', hint: 'Dica', important: 'Importante', warning: 'Atenção', caution: 'Cuidado', attention: 'Atenção', danger: 'Perigo', error: 'Erro', question: 'Pergunta', faq: 'Pergunta', help: 'Ajuda', quote: 'Citação', cite: 'Citação', example: 'Exemplo', success: 'Sucesso', check: 'OK', done: 'Feito', abstract: 'Resumo', summary: 'Resumo', tldr: 'Resumo', todo: 'A fazer', bug: 'Erro', failure: 'Falha', fail: 'Falha', missing: 'Faltando' };

const Renderer = {
  render(text, path, opts = {}) {
    setupMarked();
    const root = h('div', { class: 'md' });
    let { props, body } = splitFrontmatter(text);
    body = body.replace(/%%[\s\S]*?%%/g, '');
    if (opts.section) body = Renderer.section(body, opts.section);
    if (opts.inlineTitle && !new RegExp('^\\s*#\\s+' + stemOf(path).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*(\\n|$)').test(body)) root.append(h('div', { class: 'inline-title', text: stemOf(path) }));

      for (const [k, v] of Object.entries(props)) p.append(h('div', {}, h('b', { text: k }), h('span', { text: Array.isArray(v) ? v.join(', ') : v })));

      if (m) { if (start < 0 && norm(m[2]) === want) { start = i; lvl = m[1].length; } else if (start >= 0 && m[1].length <= lvl) return lines.slice(start, i).join('\n'); }

  },
  post(root, path, opts) {

    root.querySelectorAll('a[href]').forEach(a => {

const Search = {
  run(q) { Layout.openSide('left'); Panels.showLeft('search'); const i = $('#search-in'); i.value = q; this.exec(); i.focus(); },
  exec: debounce(() => Search._exec(), 200),
  _exec() {
    const box = $('#search-res'); box.innerHTML = ''; const raw = $('#search-in').value.trim(); if (!raw) return;
    const cs = $('#search-case').checked, rx = $('#search-re').checked;
    const filters = { tag: [], path: [], file: [] }; const terms = [];
    raw.replace(/(tag|path|file):("[^"]+"|\S+)|"([^"]+)"|(\S+)/g, (m, k, v, ph, w) => { if (k) filters[k].push(v.replace(/"/g, '').replace(/^#/, '').toLowerCase()); else terms.push(ph || w); return ''; });

    if (rx && terms.length) { try { re = new RegExp(terms.join(' '), cs ? 'g' : 'gi'); } catch (e) { box.append(h('div', { class: 'empty', text: 'Expressão regular inválida.' })); return; } }
    const N = s => cs ? s : norm(s); const T = terms.map(N);
    let total = 0, files = 0;
    const sorted = [...App.notes.values()].sort((a, b) => b.mtime - a.mtime);
    for (const n of sorted) {
      if (filters.path.length && !filters.path.every(f => n.path.toLowerCase().includes(f))) continue;
      if (filters.file.length && !filters.file.every(f => stemOf(n.path).toLowerCase().includes(f))) continue;
      if (filters.tag.length && !filters.tag.every(f => [...n.tags].some(t => t.toLowerCase() === f || t.toLowerCase().startsWith(f + '/')))) continue;
      const hits = [];
      if (re || T.length) {
        const lines = n.text.split('\n'); const nameHit = !re && T.every(t => N(stemOf(n.path)).includes(t));
        const allInFile = re ? re.test(n.text) : T.every(t => N(n.text).includes(t) || N(stemOf(n.path)).includes(t)); if (re) re.lastIndex = 0;
        if (!allInFile) continue;
        lines.forEach((l, i) => { if (re ? (re.lastIndex = 0, re.test(l)) : T.some(t => N(l).includes(t))) hits.push(i); });
        if (!hits.length && !nameHit) continue;
      }
      files++; total += hits.length;
      if (files > 300) continue;
      const f = h('div', { class: 'bl-file' }, h('div', { class: 'fn', html: icon('filetext') + esc(stemOf(n.path)) + `<span style="margin-left:auto;color:var(--faint);font-size:12px">${hits.length || ''}</span>`, onclick: () => App.open(n.path) }));
      hits.slice(0, 6).forEach(i => {
        let s = esc((n.text.split('\n')[i] || '').trim().slice(0, 240));
        if (re) s = s.replace(new RegExp(re.source, re.flags), m => '<mark>' + m + '</mark>');
        else terms.forEach(t => { const r = new RegExp('(' + esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', cs ? 'g' : 'gi'); s = s.replace(r, '<mark>$1</mark>'); });
        f.append(h('div', { class: 'bl-snip', html: s, onclick: () => App.open(n.path, { line: i }) }));
      });
      if (hits.length > 6) f.append(h('div', { class: 'bl-snip', style: { background: 'none' }, text: `+ ${hits.length - 6} ocorrências` }));
      box.append(f);
    }
    box.prepend(h('div', { class: 'list-sec', text: `${files} arquivo(s), ${total} ocorrência(s)` }));
  }
};

  async send(text) {

    const key = Settings.get('geminiKey'); if (!key) { SettingsUI.open('gemini'); return; }
    this.input.value = ''; this.input.style.height = 'auto';
    const parts = []; const v = App.active?.view; const notes = [];

      }
      if (v instanceof NoteView && this.ctx.sel && this.selection) { parts.push({ text: `[Trecho selecionado pelo usuário]\n${this.selection.slice(0, 50000)}` }); notes.push('seleção'); }
      if (v instanceof PdfView && this.ctx.pdf) {

        const mt = f.type || mimeOf(f.name);

        else parts.push({ inline_data: { mime_type: mt, data: await blobToB64(f) } });

    parts.push({ text });

  async loop() {
    this.busy = true; this.sendBtn.innerHTML = icon('x'); this.sendBtn.title = 'Parar';
    try {
      for (let round = 0; round < 10; round++) {
        const content = await this.call();
        if (!content) break;
        this.history.push(content);
        const calls = content.parts.filter(p => p.functionCall);
        if (!calls.length) break;
        const responses = [];
        for (const c of calls) {
          const fc = c.functionCall; const tb = this.bubble('tool', icon('cmd') + ' ' + esc(fc.name) + ' ' + esc(JSON.stringify(fc.args || {}).slice(0, 140)));
          let res; try { res = await this.exec(fc.name, fc.args || {}); } catch (e) { res = { erro: e.message }; }
          tb.append(h('span', { text: res.erro ? ' — ' + res.erro : ' ✓' }));
          const fr = { name: fc.name, response: res }; if (fc.id) fr.id = fc.id; responses.push({ functionResponse: fr });
        }
        this.history.push({ role: 'user', parts: responses });

    } catch (e) { if (e.name !== 'AbortError') this.bubble('err', esc(e.message)); }

  async call() {
    const model = await this.resolveModel();

      method: 'POST', signal: this.abort.signal,
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': Settings.get('geminiKey') },

  async exec(name, a) {

      const r = await fetch(`${GEM}/models?pageSize=1000${tok ? '&pageToken=' + tok : ''}`, { headers: { 'x-goog-api-key': Settings.get('geminiKey') } });
      if (!r.ok) { let m = r.status; try { m = (await r.json()).error.message; } catch (e) { } throw new Error('Gemini: ' + m); }
      const j = await r.json(); out.push(...(j.models || [])); tok = j.nextPageToken;
    } while (tok);
    return out.filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
      .map(m => this.modelInfo(m.name.replace(/^models\//, ''), m.displayName))
      .sort((a, b) => b.ver - a.ver || a.preview - b.preview || ['pro', 'flash', 'flash-lite', ''].indexOf(a.family) - ['pro', 'flash', 'flash-lite', ''].indexOf(b.family) || a.id.localeCompare(b.id));
  },
  cachedModels() { try { return JSON.parse(localStorage.getItem('codex.gemModels') || 'null'); } catch (e) { return null; } },
  async refreshModels(force) {
    const c = this.cachedModels();
    if (!force && c && Date.now() - c.t < 6 * 3600e3) return c.list;
    if (!Settings.get('geminiKey')) return c?.list || [];
    const list = await this.listModels();
    localStorage.setItem('codex.gemModels', JSON.stringify({ t: Date.now(), list }));
    this.renderModelSel();
    return list;
  },
  newest(family, list) {
    const chat = list.filter(m => !m.special && m.ver);
    const fam = family === 'pro' ? chat.filter(m => m.family === 'pro') : chat.filter(m => m.family === 'flash');
    return fam.find(m => !m.preview) || fam[0] || chat[0];
  },
  async resolveModel() {
    const sel = Settings.get('geminiModel').replace(/^models\//, '');
    if (!sel.startsWith('auto:')) return sel;
    let list = []; try { list = await this.refreshModels(); } catch (e) { list = this.cachedModels()?.list || []; }
    const m = this.newest(sel.slice(5), list);
    if (!m) throw new Error('Não foi possível obter a lista de modelos do Gemini. Escolha um modelo manualmente nas Configurações.');
    return m.id;
  },
  modelOptions(showAll) {
    const list = this.cachedModels()?.list || []; const cur = Settings.get('geminiModel');
    const np = this.newest('pro', list), nf = this.newest('flash', list);
    const opts = [['auto:pro', 'Automático: o Pro mais recente' + (np ? ' (' + np.id + ')' : '')], ['auto:flash', 'Automático: o Flash mais recente' + (nf ? ' (' + nf.id + ')' : '')]];
    list.filter(m => showAll || !m.special).forEach(m => opts.push([m.id, m.id + (m.preview ? '  · prévia' : '')]));
    if (!opts.some(o => o[0] === cur)) opts.push([cur, cur + ' (atual)']);
    return opts;
  },
  modelSelect(showAll, onChange) {
    const sel = h('select', { class: 'txt', onchange: e => { Settings.set('geminiModel', e.target.value); this.renderModelSel(); onChange && onChange(); } });
    this.modelOptions(showAll).forEach(([v, l]) => sel.append(h('option', { value: v, selected: v === Settings.get('geminiModel') }, l)));
    return sel;
  },
  renderModelSel() {
    const box = this.modelBox; if (!box) return; box.innerHTML = '';
    const sel = this.modelSelect(false); sel.classList.add('ai-model'); sel.title = 'Modelo do Gemini'; box.append(sel);
  }
};

const DrivePicker = {
  open() {
    return new Promise(res => {

      const link = h('input', { class: 'txt', placeholder: 'Ou cole aqui o link da pasta do Drive' });
      const body = h('div', {}, crumb, list, h('div', { style: { marginTop: '10px' } }, link));
      const load = async () => {
        crumb.innerHTML = ''; stack.forEach((s, i) => { crumb.append(h('a', { href: '#', style: { color: 'var(--link)' }, text: s.name, onclick: e => { e.preventDefault(); stack.splice(i + 1); load(); } })); if (i < stack.length - 1) crumb.append(' / '); });
        list.innerHTML = '<div class="empty">Carregando…</div>';

        } catch (e) { list.innerHTML = ''; list.append(h('div', { class: 'empty', text: e.message })); }
      };
      UI.modal({

        buttons: [{ label: 'Cancelar', value: null },
        { label: 'Criar pasta aqui', value: () => { UI.prompt('Nome da nova pasta', 'Códex').then(async n => { if (!n) return; try { const f = await DriveVault.createFolder(stack[stack.length - 1].id, n); stack.push(f); load(); } catch (e) { UI.error(e); } }); return { __keep: true }; } },

      }).then(res);
      load();
    });
  }
};

      row('Instruções adicionais', 'Acrescentadas às instruções do sistema (estilo, formatação, preferências).', (() => { const t = h('textarea', { class: 'txt', rows: 4, placeholder: 'Ex.: Use prosa dissertativa, sem negrito; datas em d/m/aaaa; valores em algarismos e por extenso, sem símbolo de moeda.' }); t.value = S.get('geminiExtra'); t.onchange = () => S.set('geminiExtra', t.value); return t; })()),
      sec('pen', 'Anotador de PDF'),
      row('Só caneta (Apple Pencil)', 'O dedo rola a página e só a caneta escreve. Evita riscos com a palma da mão.', sw('penOnly')),
      sec('vault', 'Cofre'),
      row('Cofre atual', App.vault ? esc(App.vault.name) + ' — ' + (App.vault.kind === 'drive' ? 'Google Drive' : App.vault.kind === 'local' ? 'pasta do computador' : 'navegador') : 'nenhum', h('div', { style: { display: 'flex', gap: '6px', flexWrap: 'wrap' } }, h('button', { class: 'btn sm', text: 'Trocar de cofre', onclick: () => { body.closest('.overlay').remove(); Welcome.show(); } }), App.vault ? h('button', { class: 'btn sm', text: 'Sincronizar', onclick: () => Shell.reloadVault() }) : null))
    );
    UI.modal({ title: 'Configurações', wide: true, body, buttons: [{ label: 'Fechar', cls: 'pri', value: true }], onClose: () => { App.tabs.forEach(t => t.view instanceof NoteView && t.view.grow && t.view.ta && (t.view.ta.spellcheck = Settings.get('spellcheck'), t.view.ta.classList.toggle('mono', Settings.get('monoEditor')))); AI.renderCtx(); if (!$('#welcome').classList.contains('hidden')) Welcome.show(); } });
    if (section) setTimeout(() => $('#set-' + section)?.scrollIntoView({ block: 'start' }), 60);
  }
};

window.addEventListener('DOMContentLoaded', () => Shell.start());

</script>
