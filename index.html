<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1e1e1e">
<title>Códex</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4 56 18v28L32 60 8 46V18z' fill='%238a6cf0'/%3E%3Cpath d='M32 14 46 22v20L32 50 18 42V22z' fill='%23fff' opacity='.85'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,700;1,400&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap">
<script src="https://cdn.jsdelivr.net/npm/marked@18.1.1/lib/marked.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"></script>
<style>
:root{
  --bg:#1e1e1e; --bg2:#262626; --bg3:#2f2f2f; --bg4:#363636; --border:#3a3a3a;
  --text:#dcddde; --muted:#999; --faint:#6a6a6a; --accent:#8a6cf0; --accent2:#a48bff;
  --accent-bg:rgba(138,108,240,.18); --link:#a48bff; --unresolved:#7d6aa8;
  --tag:#a48bff; --tag-bg:rgba(138,108,240,.15); --hl:rgba(255,208,0,.35);
  --code-bg:#2a2a2a; --danger:#e5534b; --ok:#4caf50; --warn:#d9a300;
  --shadow:0 8px 30px rgba(0,0,0,.45); --radius:6px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --editor-size:16px; --line-width:760px;
}
:root[data-theme="light"]{
  --bg:#ffffff; --bg2:#f6f6f6; --bg3:#ececec; --bg4:#e2e2e2; --border:#dedede;
  --text:#222; --muted:#666; --faint:#9a9a9a; --accent:#7050e0; --accent2:#5b3cc4;
  --accent-bg:rgba(112,80,224,.12); --link:#5b3cc4; --unresolved:#9a8bc9;
  --tag:#5b3cc4; --tag-bg:rgba(112,80,224,.10); --code-bg:#f2f2f2; --shadow:0 8px 30px rgba(0,0,0,.18);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;overscroll-behavior:none}
body{height:100dvh;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
input,textarea,select{font:inherit;color:var(--text)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}

/* layout */
#app{display:flex;height:calc(100dvh - 24px);width:100vw}
#ribbon{width:44px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;flex:none}
#ribbon .sp{flex:1}
.rb{width:34px;height:34px;border:0;background:none;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer}
.rb:hover{background:var(--bg3);color:var(--text)}
.rb.on{color:var(--accent2)}
aside{background:var(--bg2);display:flex;flex-direction:column;min-width:0;flex:none;position:relative}
#left{width:270px;border-right:1px solid var(--border)}
#right{width:320px;border-left:1px solid var(--border)}
aside.collapsed{display:none}
.resizer{position:absolute;top:0;bottom:0;width:6px;cursor:col-resize;z-index:5}
#left .resizer{right:-3px} #right .resizer{left:-3px}
.side-tabs{display:flex;gap:2px;padding:6px 6px 0;border-bottom:1px solid var(--border);flex:none}
.side-tab{border:0;background:none;padding:6px 8px;border-radius:6px 6px 0 0;cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:4px}
.side-tab.on{color:var(--text);background:var(--bg3)}
.side-tab:hover{color:var(--text)}
.side-body{flex:1;overflow:auto;min-height:0}
.pane{display:none;height:100%;flex-direction:column}
.pane.on{display:flex}
.pane-head{display:flex;align-items:center;gap:2px;padding:6px 8px;border-bottom:1px solid var(--border);flex:none}
.pane-head .title{flex:1;font-weight:600;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.ib{border:0;background:none;width:28px;height:28px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;flex:none}
.ib:hover{background:var(--bg3);color:var(--text)}
.ib.on{color:var(--accent2);background:var(--accent-bg)}
.ib svg.i{width:16px;height:16px}
.pane-scroll{flex:1;overflow:auto;padding:4px 0 40px;min-height:0}

/* tree */
.tree-item{display:flex;align-items:center;gap:4px;padding:3px 8px;margin:0 4px;border-radius:5px;cursor:pointer;white-space:nowrap;color:var(--text);user-select:none;-webkit-user-select:none;min-height:26px}
.tree-item:hover{background:var(--bg3)}
.tree-item.active{background:var(--accent-bg);color:var(--accent2)}
.tree-item.drop{outline:1px dashed var(--accent)}
.tree-item .chev{width:14px;display:inline-flex;color:var(--faint);transition:transform .12s}
.tree-item .chev svg.i{width:13px;height:13px}
.tree-item.open>.chev{transform:rotate(90deg)}
.tree-item .nm{overflow:hidden;text-overflow:ellipsis;flex:1}
.tree-item .ext{font-size:10px;color:var(--faint);border:1px solid var(--border);border-radius:3px;padding:0 3px}
.tree-folder{font-weight:500}
.tree-children{margin-left:12px;border-left:1px solid var(--border)}

/* center */
#center{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
#tabbar{display:flex;align-items:flex-end;background:var(--bg2);border-bottom:1px solid var(--border);height:38px;flex:none;overflow-x:auto;scrollbar-width:none;padding:0 4px}
#tabbar::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 10px;max-width:220px;min-width:90px;border-radius:7px 7px 0 0;cursor:pointer;color:var(--muted);flex:none}
.tab:hover{background:var(--bg3)}
.tab.on{background:var(--bg);color:var(--text)}
.tab .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .x{opacity:.5;width:20px;height:20px}
.tab .dirty::after{content:"•";color:var(--accent2);margin-left:2px}
#tabbar .newtab{margin:0 0 3px 4px}
#views{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
.view-head{display:flex;align-items:center;gap:4px;padding:4px 10px;flex:none;min-height:36px}
.view-head .crumb{flex:1;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.view-head .crumb b{color:var(--text);font-weight:500}
.view-body{flex:1;min-height:0;display:flex}
.view-body>*{min-width:0}

/* editor */
.ed-wrap{flex:1;overflow:auto;display:flex;justify-content:center}
.ed{width:100%;max-width:var(--line-width);min-height:100%;padding:24px 28px 50vh;border:0;outline:none;resize:none;background:transparent;color:var(--text);font-family:var(--text-font,var(--font));font-size:var(--editor-size);line-height:1.65;tab-size:4;overflow:hidden}
.ed.mono{font-family:var(--mono);font-size:calc(var(--editor-size) - 1px)}
.ed-stack{position:relative;width:100%;max-width:var(--line-width)}
.ed-stack .ed{max-width:none;position:relative;z-index:1}
.ed-hl{position:absolute;inset:0;padding:24px 28px 50vh;font-family:var(--text-font,var(--font));font-size:var(--editor-size);line-height:1.65;tab-size:4;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:break-word;color:var(--text);pointer-events:none;overflow:hidden}
.ed.hl-on{color:transparent;caret-color:var(--text);-webkit-text-fill-color:transparent}
.ed.hl-on::selection{background:rgba(138,108,240,.35);-webkit-text-fill-color:transparent}
.ed.mono~.ed-hl,.ed-stack:has(.ed.mono) .ed-hl{font-family:var(--mono);font-size:calc(var(--editor-size) - 1px)}
.m-faint{color:var(--faint)} .m-h{color:var(--text);text-shadow:.45px 0 0 currentColor,-.2px 0 0 currentColor}
.m-h1{color:var(--accent2)} .m-h2{color:#c9b8ff} :root[data-theme="light"] .m-h2{color:#4a33b0}
.m-b{text-shadow:.45px 0 0 currentColor} .m-i{color:#d8c690} :root[data-theme="light"] .m-i{color:#8a6a00}
.m-link{color:var(--link)} .m-url{color:var(--link);text-decoration:underline;text-decoration-color:var(--faint)}
.m-tag{color:var(--tag)} .m-hl{background:var(--hl);border-radius:2px} .m-del{text-decoration:line-through;color:var(--muted)}
.m-code,.m-codeblk{color:#e6a26a;background:var(--code-bg);border-radius:3px} :root[data-theme="light"] .m-code,:root[data-theme="light"] .m-codeblk{color:#b4501b}
.m-quote{color:var(--accent)} .m-callout{color:var(--accent2)} .m-list{color:var(--accent2)} .m-done{color:var(--muted);text-decoration:line-through}
.m-fm{color:var(--muted)}
.title-input{width:100%;max-width:var(--line-width);border:0;outline:none;background:transparent;font-size:calc(var(--editor-size) * 1.9);font-weight:700;padding:28px 28px 0;color:var(--text)}
.ed-col{display:flex;flex-direction:column;align-items:center;width:100%}
.split .ed-wrap,.split .reader{flex:1 1 50%}
.split .reader{border-left:1px solid var(--border)}

/* reader */
.reader{flex:1;overflow:auto;display:flex;justify-content:center}
.md{width:100%;max-width:var(--line-width);padding:24px 28px 50vh;font-family:var(--text-font,var(--font));font-size:var(--editor-size);line-height:1.7;word-wrap:break-word}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{line-height:1.3;margin:1.3em 0 .5em;font-weight:700}
.md h1{font-size:1.9em}.md h2{font-size:1.55em}.md h3{font-size:1.3em}.md h4{font-size:1.12em}
.md .inline-title{font-size:1.9em;font-weight:700;margin:.3em 0 .6em}
.md p{margin:.6em 0}
.md a{color:var(--link);text-decoration:none}
.md a:hover{text-decoration:underline}
.md a.internal-link{cursor:pointer}
.md a.internal-link.unresolved{color:var(--unresolved);opacity:.85;text-decoration:underline dotted}
.md a.tag{background:var(--tag-bg);color:var(--tag);padding:1px 7px;border-radius:12px;font-size:.88em;cursor:pointer}
.md mark{background:var(--hl);color:inherit;padding:0 2px;border-radius:2px}
.md code{font-family:var(--mono);background:var(--code-bg);padding:1px 5px;border-radius:4px;font-size:.88em}
.md pre{background:var(--code-bg);padding:12px 14px;border-radius:6px;overflow:auto}
.md pre code{background:none;padding:0}
.md blockquote{margin:.8em 0;padding:2px 16px;border-left:3px solid var(--accent);color:var(--muted)}
.md table{border-collapse:collapse;margin:1em 0;display:block;overflow:auto}
.md th,.md td{border:1px solid var(--border);padding:6px 10px}
.md th{background:var(--bg2)}
.md img{max-width:100%;border-radius:4px}
.md hr{border:0;border-top:1px solid var(--border);margin:2em 0}
.md ul,.md ol{padding-left:1.6em}
.md li.task{list-style:none;margin-left:-1.4em}
.md li.task input{margin-right:8px;transform:scale(1.15);accent-color:var(--accent)}
.md li.task.done>span.tt{text-decoration:line-through;color:var(--muted)}
.md .props{border:1px solid var(--border);border-radius:6px;margin:0 0 1.2em;font-size:.85em}
.md .props div{display:flex;padding:4px 10px;border-bottom:1px solid var(--border)}
.md .props div:last-child{border:0}
.md .props b{width:130px;color:var(--muted);font-weight:500;flex:none}
.callout{border-radius:6px;padding:10px 14px;margin:1em 0;background:rgba(80,120,230,.10);border-left:4px solid #5a82e6}
.callout-title{font-weight:600;display:flex;align-items:center;gap:6px;cursor:default}
.callout.foldable .callout-title{cursor:pointer}
.callout.folded .callout-content{display:none}
.callout-content>:first-child{margin-top:.4em}
.callout-content>:last-child{margin-bottom:0}
.callout[data-c="warning"],.callout[data-c="atencao"],.callout[data-c="caution"]{background:rgba(230,150,30,.12);border-color:#e6961e}
.callout[data-c="danger"],.callout[data-c="error"],.callout[data-c="bug"],.callout[data-c="perigo"]{background:rgba(230,70,70,.12);border-color:#e64646}
.callout[data-c="tip"],.callout[data-c="success"],.callout[data-c="dica"],.callout[data-c="check"]{background:rgba(60,180,110,.12);border-color:#3cb46e}
.callout[data-c="question"],.callout[data-c="faq"],.callout[data-c="pergunta"]{background:rgba(220,190,40,.12);border-color:#d4b51e}
.callout[data-c="quote"],.callout[data-c="cite"],.callout[data-c="citacao"]{background:rgba(150,150,150,.12);border-color:#999}
.callout[data-c="example"],.callout[data-c="exemplo"],.callout[data-c="lei"]{background:rgba(140,100,240,.12);border-color:#8c64f0}
.embed{border-left:2px solid var(--accent);padding:4px 0 4px 14px;margin:1em 0}
.embed-title{font-size:.8em;color:var(--muted);margin-bottom:4px;display:flex;gap:6px;align-items:center}
.embed-title a{color:var(--muted)}
.embed-pdf{border:1px solid var(--border);border-radius:6px;margin:1em 0;overflow:hidden}
.embed-pdf .bar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg2);font-size:13px}
.embed-pdf .bar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.embed-pdf .pages{max-height:620px;overflow:auto;background:#555;padding:8px;display:flex;flex-direction:column;align-items:center;gap:8px}
.embed-pdf canvas{max-width:100%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.yt{position:relative;width:100%;aspect-ratio:16/9;margin:1em 0}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:6px}
.missing-embed{color:var(--unresolved);font-style:italic}

/* buttons */
.btn{border:1px solid var(--border);background:var(--bg3);padding:7px 14px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--bg4)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
input.txt,textarea.txt,select.txt{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px 10px;width:100%;outline:none}
input.txt:focus,textarea.txt:focus,select.txt:focus{border-color:var(--accent)}

/* status */
#statusbar{height:24px;display:flex;align-items:center;justify-content:flex-end;gap:16px;padding:0 12px;font-size:12px;color:var(--muted);background:var(--bg2);border-top:1px solid var(--border)}
#statusbar .l{margin-right:auto;display:flex;gap:6px;align-items:center}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding-top:10vh}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);width:min(560px,94vw);max-height:80vh;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{width:min(860px,96vw)}
.modal h3{margin:0;padding:14px 18px 8px;font-size:16px}
.modal .mbody{padding:8px 18px 14px;overflow:auto}
.modal .mfoot{display:flex;justify-content:flex-end;gap:8px;padding:10px 18px 14px;border-top:1px solid var(--border)}
.pal-input{border:0;border-bottom:1px solid var(--border);background:transparent;padding:14px 16px;font-size:16px;outline:none;width:100%}
.pal-list{overflow:auto;max-height:55vh;padding:4px}
.pal-item{padding:8px 12px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:10px}
.pal-item .sub{color:var(--faint);font-size:12px;margin-left:auto;white-space:nowrap}
.pal-item .main{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-item.sel{background:var(--accent-bg)}
.pal-item em{font-style:normal;color:var(--accent2);font-weight:600}
.pal-hint{padding:6px 14px;font-size:12px;color:var(--faint);border-top:1px solid var(--border)}
.menu{position:fixed;z-index:200;background:var(--bg2);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:4px;min-width:200px}
.menu .mi{padding:7px 12px;border-radius:5px;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
.menu .mi:hover{background:var(--accent-bg)}
.menu .mi.danger{color:var(--danger)}
.menu .sep{height:1px;background:var(--border);margin:4px 0}
#toasts{position:fixed;right:16px;bottom:36px;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--bg3);border:1px solid var(--border);padding:9px 14px;border-radius:8px;box-shadow:var(--shadow);max-width:380px;animation:tin .15s}
.toast.err{border-color:var(--danger)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
.suggest{position:fixed;z-index:150;background:var(--bg2);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);max-height:260px;overflow:auto;min-width:260px;max-width:420px;padding:4px}
.popover{position:fixed;z-index:140;width:440px;max-height:360px;overflow:auto;background:var(--bg);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow)}
.popover .md{padding:12px 18px;font-size:14px}

/* side panes */
.list-sec{padding:8px 12px 2px;color:var(--muted);font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.bl-file{margin:2px 6px;border-radius:6px}
.bl-file .fn{padding:5px 8px;cursor:pointer;font-weight:500;border-radius:5px;display:flex;gap:6px;align-items:center}
.bl-file .fn:hover{background:var(--bg3)}
.bl-snip{margin:2px 8px 6px 22px;padding:6px 8px;font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:5px;cursor:pointer;line-height:1.45}
.bl-snip mark{background:var(--accent-bg);color:var(--accent2)}
.empty{padding:16px;color:var(--faint);font-size:13px;line-height:1.5}
.outline-item{padding:4px 10px;cursor:pointer;border-radius:5px;margin:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.outline-item:hover{background:var(--bg3)}
.tag-row{display:flex;padding:4px 12px;cursor:pointer;margin:0 6px;border-radius:5px}
.tag-row:hover{background:var(--bg3)}
.tag-row span{flex:1;color:var(--tag)}
.tag-row i{font-style:normal;color:var(--faint);font-size:12px}
.search-box{padding:8px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--border)}
.search-opts{display:flex;gap:10px;font-size:12px;color:var(--muted)}
.search-opts label{display:flex;gap:4px;align-items:center;cursor:pointer}

/* welcome */
#welcome{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto;display:flex;justify-content:center}
.wl{max-width:860px;width:100%;padding:6vh 20px 40px}
.wl h1{font-size:30px;margin:0 0 6px}
.wl p.sub{color:var(--muted);margin:0 0 28px;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{border:1px solid var(--border);background:var(--bg2);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:16px;display:flex;gap:8px;align-items:center}
.card p{margin:0;color:var(--muted);line-height:1.5;font-size:13.5px;flex:1}
.card .note{font-size:12px;color:var(--warn)}
.recent{margin-top:28px}
.recent h4{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.recent .r{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;background:var(--bg2)}
.recent .r:hover{border-color:var(--accent)}
.recent .r span{flex:1}
.recent .r small{color:var(--faint)}

/* settings */
.set-row{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--border);align-items:center}
.set-row .lbl{flex:1}
.set-row .lbl b{display:block;font-weight:500;margin-bottom:2px}
.set-row .lbl small{color:var(--muted);line-height:1.4;display:block}
.set-row .ctl{width:280px;flex:none}

.pdfv[data-tool="pen"] .live,.pdfv[data-tool="hl"] .live,.pdfv[data-tool="line"] .live,.pdfv[data-tool="rect"] .live,.pdfv[data-tool="arrow"] .live{cursor:crosshair}

.m-tag{color:var(--tag)} .m-hl{background:var(--hl);border-radius:2px} .m-del{text-decoration:line-through;color:var(--muted)}

.m-quote{color:var(--accent)} .m-callout{color:var(--accent2)} .m-list{color:var(--accent2)} .m-done{color:var(--muted);text-decoration:line-through}
.m-fm{color:var(--muted)}
.title-input{padding-left:18px;padding-right:18px}
  .set-row{flex-direction:column;align-items:stretch}

}

}

}

class LocalVault {

  async mkdir(p) { await this._dir(p, true); }

/* ---------- referências a parágrafos (blocos ^id, como no Obsidian) ---------- */
const BID_RE = /\s\^([A-Za-z0-9-]+)\s*$/;

  list(text) {

    text.split('\n').forEach((l, i) => {

  },
  plain(l) { return l.replace(/^\s*(#{1,6}\s+|>\s*(\[![^\]]+\][+-]?\s*)?|[-*+]\s+(\[[ xX]\]\s+)?|\d+[.)]\s+)/, '').replace(/!?\[\[([^\]|]*\|)?([^\]]*)\]\]/g, '$2').replace(/<[^>]+>/g, '').replace(/[*_=~`]/g, '').trim(); },

const Renderer = {
  render(text, path, opts = {}) {
    setupMarked();
    const root = h('div', { class: 'md' });

    if (opts.section) body = Renderer.section(body, opts.section);
    { let code = false; body = body.split('\n').map(l => { if (/^\s*(```|~~~)/.test(l)) code = !code; return code ? l : l.replace(BID_RE, (m, id) => ` <span class="blockid" data-block="${id}"></span>`); }).join('\n'); }

  },
  section(body, sub) {

  post(root, path, opts) {

    });
    root.querySelectorAll('span.blockid').forEach(sp => { const b = sp.closest('p,li,blockquote,h1,h2,h3,h4,h5,h6,td,.callout') || sp.parentElement; b.dataset.blockId = sp.dataset.block; });
    root.querySelectorAll('a.internal-link').forEach(a => {

      if (!cb) return; li.classList.add('task'); cb.removeAttribute('disabled'); cb.dataset.task = ti++;

    /* callouts (de dentro para fora) */

      const p = bq.firstElementChild; if (!p || p.tagName !== 'P') return;
      const m = /^\s*\[!([\wÀ-ſ-]+)\]([+-]?)[ \t]*([^<\n]*?)\s*(<br>\s*|\n|$)/i.exec(p.innerHTML); if (!m) return;

/* ===================== CÓDIGOS E LEIS: ESTRUTURA E COMENTÁRIOS POR DISPOSITIVO ===================== */
const Lex = {
  STRUCT: [
    [/^PARTE\s+(GERAL|ESPECIAL|[IVXLCDM]+)\b/i, 1, 'Parte'], [/^LIVRO\s+(COMPLEMENTAR|[IVXLCDM]+|[ÚU]NICO)\b/i, 2, 'Livro'],
    [/^T[ÍI]TULO\s+([IVXLCDM]+(-[A-Z])?|[ÚU]NICO)\b/i, 3, 'Título'], [/^SUBT[ÍI]TULO\s+([IVXLCDM]+|[ÚU]NICO)\b/i, 4, 'Subtítulo'],
    [/^CAP[ÍI]TULO\s+([IVXLCDM]+(-[A-Z])?|[ÚU]NICO)\b/i, 5, 'Capítulo'], [/^SE[ÇC][ÃA]O\s+([IVXLCDM]+(-[A-Z])?|[ÚU]NICA)\b/i, 6, 'Seção'],
    [/^SUBSE[ÇC][ÃA]O\s+([IVXLCDM]+|[ÚU]NICA)\b/i, 7, 'Subseção'],
    [/^(ATO\s+DAS\s+)?DISPOSI[ÇC][ÕO]ES\s+(CONSTITUCIONAIS\s+)?(GERAIS|FINAIS|TRANSIT[ÓO]RIAS|PRELIMINARES|FINAIS\s+E\s+TRANSIT[ÓO]RIAS)\b/i, 3, 'Disposições'],
    [/^PRE[ÂA]MBULO\s*$/i, 3, 'Preâmbulo']
  ],
  ROMAN: /^(?=[IVXLCDM])M{0,4}(CM|CD|D?C{0,3})(XC|XL|L?X{0,3})(IX|IV|V?I{0,3})$/,
  /* tira marcações Markdown do início da linha; devolve o deslocamento */
  strip(l) { const m = /^(\s*(?:#{1,6}\s+)?(?:>\s*)*(?:\*\*|__)?\s*)/.exec(l); const t = l.slice(m[0].length).replace(/(\*\*|__)\s*$/, ''); return { off: m[0].length, t }; },
  ord(n) { return +String(n).replace(/\./g, '') < 10 ? n + 'º' : n; },
  /* máquina de estados: alimentada linha a linha, na ordem do texto */
  ctx() {
    const s = { art: null, par: null, inc: null, pendingRubric: false };
    return line => {
      const { off, t } = Lex.strip(line); if (!t.trim()) return null;
      for (const [re, level, kind] of Lex.STRUCT) if (re.test(t)) { s.pendingRubric = true; return { kind: 'struct', level, text: t.replace(/[*_]+/g, '').trim(), name: kind }; }
      let m;
      if ((m = /^(Art\.?\s*(\d{1,4}(?:\.\d{3})*)\s*(?:º|°|o(?=[\s.]))?(?:\s*-\s*([A-Z]{1,2}))?\.?)(?=\s|$|\*)/.exec(t))) {
        s.art = 'Art. ' + Lex.ord(m[2]) + (m[3] ? '-' + m[3] : ''); s.par = s.inc = null; s.pendingRubric = false;
        return { kind: 'art', label: s.art, start: off, end: off + m[1].length, text: t };
      }
      if (s.art && (m = /^(§\s*(\d+)\s*(?:º|°|o(?=[\s.]))?(?:\s*-\s*([A-Z]))?\.?)(?=\s)/.exec(t))) { s.par = s.art + ', § ' + Lex.ord(m[2]) + (m[3] ? '-' + m[3] : ''); s.inc = null; return { kind: 'par', label: s.par, start: off, end: off + m[1].length }; }
      if (s.art && (m = /^(Par[áa]grafo\s+[úu]nico\.?)/i.exec(t))) { s.par = s.art + ', parágrafo único'; s.inc = null; return { kind: 'par', label: s.par, start: off, end: off + m[1].length }; }
      if (s.art && (m = /^([IVXLCDM]+)(?:-[A-Z])?(?=\s*[-–—]\s)/.exec(t)) && Lex.ROMAN.test(m[1])) { s.inc = (s.par || s.art) + ', inc. ' + m[0]; return { kind: 'inc', label: s.inc, start: off, end: off + m[0].length }; }
      if (s.inc && (m = /^([a-z])\)(?=\s)/.exec(t))) return { kind: 'al', label: s.inc + ', al. ' + m[1], start: off, end: off + m[0].length };
      if (s.pendingRubric && t.length < 160 && !/^\s*$/.test(t)) { s.pendingRubric = false; return { kind: 'rubric', text: t.replace(/[*_]+/g, '').trim() }; }
      return null;
    };
  },
  cache: new WeakMap(), strCache: { s: null, r: null },
  analyze(text) {
    if (Lex.strCache.s === text) return Lex.strCache.r;
    const lines = text.split('\n'); const feed = Lex.ctx(); const items = new Array(lines.length); let arts = 0, code = false;
    for (let i = 0; i < lines.length; i++) {
      if (/^\s*(```|~~~)/.test(lines[i])) { code = !code; continue; } if (code) continue;
      const it = feed(lines[i]); if (it) { items[i] = it; if (it.kind === 'art') arts++; }
    }
    const r = { items, legal: arts >= 3 }; Lex.strCache = { s: text, r }; return r;
  },
  /* caminho do comentário de um dispositivo */
  folder() { return Settings.get('commentsFolder') || 'Comentários'; },
  commentPath(notePath, label) { return joinP(Lex.folder(), App.safeName(stemOf(notePath)), App.safeName(label) + '.md'); },
  hasComment(notePath, label) { return App.fileMap.has(Lex.commentPath(notePath, label)); },
  /* marca artigos, parágrafos, incisos e alíneas no texto já renderizado (modo leitura) */
  decorateDOM(root, notePath) {
    const feed = Lex.ctx();
    root.querySelectorAll('p,li,h1,h2,h3,h4,h5,h6').forEach(block => {
      if (block.closest('.embed,pre,code,table')) return;
      const w = document.createTreeWalker(block, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT); let start = true, n; const todo = [];
      while ((n = w.nextNode())) { if (n.nodeType === 1) { if (n.tagName === 'BR') start = true; continue; } if (!n.textContent.trim()) continue; if (start) todo.push(n); start = false; }
      todo.forEach(tn => {
        let line = tn.textContent; const it = feed(line.replace(/^\s+/, ''));
        if (!it) return;
        if (it.kind === 'struct') { if (todo.indexOf(tn) === 0 && todo.length <= 3) block.classList.add('lex-struct', 'lex-' + it.level); return; }
        if (it.kind === 'rubric') { if (todo.length === 1) block.classList.add('lex-rubric'); return; }
        const lead = line.length - line.replace(/^\s+/, '').length; const len = it.end - it.start;
        const r = tn.splitText(lead); r.splitText(len);
        const sp = h('span', { class: 'dispo' + (Lex.hasComment(notePath, it.label) ? ' has-c' : ''), 'data-dispo': it.label, 'data-note': notePath }); r.replaceWith(sp); sp.append(r);
        if (Lex.hasComment(notePath, it.label)) sp.after(h('span', { class: 'cbadge', 'data-dispo': it.label, 'data-note': notePath, title: 'Ver comentário', html: icon('quote') }));
      });
    });
  },
  /* árvore de navegação (sumário) */
  outline(text) {
    const { items, legal } = Lex.analyze(text); const lines = text.split('\n'); const nodes = []; let code = false;
    for (let i = 0; i < lines.length; i++) {
      if (/^\s*(```|~~~)/.test(lines[i])) { code = !code; continue; } if (code) continue;
      const hm = /^(#{1,6})\s+(.+?)\s*#*$/.exec(lines[i]);
      const it = items[i];
      if (legal && it?.kind === 'struct') { let title = it.text; const nx = items.slice(i + 1, i + 4).findIndex(x => x); const r = nx >= 0 ? items[i + 1 + nx] : null; if (r?.kind === 'rubric') title += ' — ' + r.text; nodes.push({ level: it.level, text: title, line: i, kind: 'struct' }); continue; }
      if (hm) { nodes.push({ level: hm[1].length, text: hm[2].replace(BID_RE, '').replace(/[*_=`]/g, ''), line: i, kind: 'h' }); continue; }
      if (legal && it?.kind === 'art') { const rest = it.text.slice(it.end - Lex.strip(lines[i]).off).trim().replace(/[*_]+/g, ''); nodes.push({ level: 8, text: it.label + (rest ? ' — ' + (rest.length > 60 ? rest.slice(0, 58) + '…' : rest) : ''), line: i, kind: 'art' }); }
    }
    return { nodes, legal };
  }
};

/* ---------- janela de comentário (ao passar o mouse ou tocar no selo) ---------- */
const CommentPop = {
  el: null, t: null, pinned: false,
  async show(anchor, notePath, label, opts = {}) {
    if (this.el && this.el.dataset.key === notePath + '|' + label && !opts.edit) return;
    this.hide(true); this.pinned = !!opts.pin;
    const p = Lex.commentPath(notePath, label); const exists = App.fileMap.has(p);
    const el = h('div', { class: 'popover cpop', 'data-key': notePath + '|' + label, 'data-from': p }); this.el = el;
    const head = h('div', { class: 'cpop-head' }, h('b', { text: label }), h('span', { class: 'sub', text: stemOf(notePath) }));
    const body = h('div', { class: 'cpop-body' });
    const btns = h('div', { class: 'cpop-btns' });
    const view = async () => {
      body.innerHTML = ''; btns.innerHTML = '';
      if (App.fileMap.has(p)) {
        const md = Renderer.render(await App.readNote(p), p, { noProps: true }); md.style.padding = '0'; body.append(md);
        btns.append(h('button', { class: 'btn sm', html: icon('edit') + 'Editar', onclick: () => edit() }), h('button', { class: 'btn sm', html: icon('plus') + 'Abrir como nota', onclick: () => { this.hide(true); App.open(p, { newTab: true }); } }));
      } else {
        body.append(h('div', { class: 'empty', style: { padding: '4px 0' }, text: 'Nenhum comentário neste dispositivo.' }));
        btns.append(h('button', { class: 'btn sm pri', html: icon('edit') + 'Comentar', onclick: () => edit() }));
      }
    };
    const edit = async () => {
      this.pinned = true; body.innerHTML = ''; btns.innerHTML = '';
      const cur = App.fileMap.has(p) ? await App.readNote(p) : '';
      const ta = h('textarea', { class: 'txt cpop-ta', placeholder: 'Escreva o comentário (Markdown, links [[ ]], #tags…)' }); ta.value = cur.replace(/^---[\s\S]*?\n---\n?/, '');
      const fm = cur.match(/^---[\s\S]*?\n---\n?/)?.[0] || `---\nlei: "[[${App.linkText(notePath)}]]"\ndispositivo: "${label}"\n---\n`;
      body.append(ta);
      btns.append(h('button', { class: 'btn sm', text: 'Cancelar', onclick: () => exists || App.fileMap.has(p) ? view() : this.hide(true) }),
        h('button', { class: 'btn sm pri', html: icon('save') + 'Salvar', onclick: async () => {
          const t = ta.value.trim(); if (!t && !App.fileMap.has(p)) return this.hide(true);
          await App.writeNote(p, fm + t + '\n'); App.renderTreeSoon(); LiveRefresh(); this.pinned = false; view();
        } }));
      setTimeout(() => ta.focus(), 30);
      ta.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) btns.querySelector('.pri').click(); if (e.key === 'Escape') { e.stopPropagation(); view(); } });
    };
    el.append(head, body, btns); document.body.append(el);
    opts.edit ? await edit() : await view();
    this.place(anchor);
    el.onpointerenter = () => clearTimeout(this.t); el.onpointerleave = () => { if (!this.pinned) this.hideSoon(); };
  },
  place(anchor) {
    const el = this.el; if (!el) return; const r = anchor.getBoundingClientRect ? anchor.getBoundingClientRect() : anchor; const pr = el.getBoundingClientRect();
    el.style.left = Math.max(8, Math.min(r.left, innerWidth - pr.width - 8)) + 'px';
    el.style.top = Math.max(8, Math.min(innerHeight - pr.height - 8, r.bottom + pr.height + 10 < innerHeight ? r.bottom + 6 : r.top - pr.height - 6)) + 'px';
  },
  hideSoon() { clearTimeout(this.t); this.t = setTimeout(() => this.hide(), 350); },
  hide(force) { if (this.pinned && !force) return; clearTimeout(this.t); this.el?.remove(); this.el = null; this.pinned = false; },
  bind() {
    let timer;
    document.addEventListener('pointerover', e => {
      if (e.pointerType !== 'mouse') return;
      const a = e.target.closest?.('[data-dispo]'); if (!a || a.closest('.cpop')) return;
      clearTimeout(timer); clearTimeout(this.t);
      timer = setTimeout(() => this.show(a, a.dataset.note, a.dataset.dispo), 350);
      a.addEventListener('pointerleave', () => { clearTimeout(timer); if (!this.pinned) this.hideSoon(); }, { once: true });
    });
    document.addEventListener('pointerdown', e => {
      const b = e.target.closest?.('.cbadge'); if (b) { e.preventDefault(); e.stopPropagation(); this.show(b, b.dataset.note, b.dataset.dispo, { pin: true }); return; }
      if (this.el && !this.el.contains(e.target)) this.hide(true);
    }, true);
  }
};
function LiveRefresh() { App.tabs.forEach(t => { if (t.view?.cm) t.view.cm.dispatch({ effects: LP_REFRESH.of(null) }); if (t.view?.mode === 'read') t.view.renderReader?.(); }); }

/* comentar o dispositivo onde está o cursor */
async function commentAtCursor(nv) {
  if (!nv?.cm) return;
  const st = nv.cm.state; const ln = st.doc.lineAt(st.selection.main.head).number - 1;
  const { items } = Lex.analyze(nv.text); let i = ln; while (i >= 0 && !(items[i] && items[i].label)) { if (items[i]?.kind === 'struct') break; i--; }
  const it = i >= 0 ? items[i] : null;
  if (!it?.label) return UI.toast('Coloque o cursor em um artigo, parágrafo, inciso ou alínea (ex.: “Art. 5º”, “§ 1º”, “I –”, “a)”).', true);
  nv.cm.dispatch({ effects: CM.EditorView.scrollIntoView(st.selection.main.head, { y: 'center' }) });
  await new Promise(r => requestAnimationFrame(() => setTimeout(r, 30)));
  const [x, y] = nv.ta.coords(st.selection.main.head);
  CommentPop.show({ left: x, top: y - 20, bottom: y, getBoundingClientRect() { return this; } }, nv.path, it.label, { edit: true, pin: true });
}

  set value(v) { const st = this.cm.state; const a = Math.min(st.selection.main.anchor, v.length); this.cm.dispatch({ changes: { from: 0, to: st.doc.length, insert: v }, selection: { anchor: a } }); }
  slice(a, b) { const L = this.cm.state.doc.length; return this.cm.state.sliceDoc(Math.max(0, a), Math.min(L, b ?? L)); }
  get selectionStart() { return this.cm.state.selection.main.from; }
  get selectionEnd() { return this.cm.state.selection.main.to; }
  setSelectionRange(a, b) { const L = this.cm.state.doc.length; this.cm.dispatch({ selection: { anchor: Math.max(0, Math.min(a, L)), head: Math.max(0, Math.min(b ?? a, L)) }, scrollIntoView: true }); }
  focus() { this.cm.focus(); }
  replace(s, e, t) { const L = this.cm.state.doc.length; s = Math.max(0, Math.min(s, L)); e = Math.max(s, Math.min(e, L)); this.cm.dispatch({ changes: { from: s, to: e, insert: t }, selection: { anchor: s + t.length }, userEvent: 'input', scrollIntoView: true }); }
  coords(pos) { const c = this.cm.coordsAtPos(pos); return c ? [c.left, c.bottom + 2] : [100, 100]; }
}

        const f = it.getAsFile(); if (!f) continue;
        const ext = (f.type.split('/')[1] || 'png').replace('jpeg', 'jpg').replace('svg+xml', 'svg');
        const name = f.name && f.name !== 'image.png' ? f.name : 'Colado ' + fmtDate(new Date(), 'YYYY-MM-DD HH.mm') + '.' + ext;
        const p = await App.saveAttachment(f, name.replace(/:/g, '.'), this.path);
        insertText(this.ta, this.ta.selectionStart, this.ta.selectionEnd, '![[' + App.linkText(p) + ']]\n');
      }
      return;
    }
    const txt = e.clipboardData?.getData('text/plain') || ''; const s = this.ta.selectionStart, en = this.ta.selectionEnd;
    if (/^https?:\/\/\S+$/.test(txt.trim()) && en > s) { e.preventDefault(); insertText(this.ta, s, en, '[' + this.ta.value.slice(s, en) + '](' + txt.trim() + ')'); }
  }
  async drop(e) {
    const files = [...(e.dataTransfer?.files || [])]; if (!files.length) return;
    e.preventDefault();
    for (const f of files) {
      if (extOf(f.name) === 'md') { const p = App.uniquePath(joinP(dirOf(this.path), f.name)); await App.writeNote(p, await f.text()); insertText(this.ta, this.ta.selectionStart, this.ta.selectionEnd, '[[' + App.linkText(p) + ']]\n'); continue; }
      const p = await App.saveAttachment(f, f.name, this.path);
      insertText(this.ta, this.ta.selectionStart, this.ta.selectionEnd, '![[' + App.linkText(p) + ']]\n');
    }
    App.renderTree();
  }
}

const Links = {

const Popover = {

const Panels = {

  refreshSoon: debounce(() => Panels.refresh(), 400),
  refresh() {
    if (!App.vault) return;
    if (this.left === 'tags') this.renderTags(); if (this.left === 'bookmarks') this.renderBookmarks();

  },
  backlinks(path) {
    const out = []; if (!path) return out;
    for (const [p, n] of App.notes) for (const l of n.links) if (App.resolve(l.target || p, p) === path && !(p === path && !l.target)) out.push({ from: p, line: l.line, n });
    return out;
  },
  snippet(text, line, word) {
    const ln = (text.split('\n')[line] || '').trim(); let s = esc(ln.length > 220 ? ln.slice(0, 220) + '…' : ln);
    s = s.replace(/\[\[([^\]]+)\]\]/g, (m, x) => '<mark>' + x.split('|').pop() + '</mark>');
    if (word) { const re = new RegExp('(' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'); s = s.replace(re, '<mark>$1</mark>'); }
    return s;
  },
  renderBacklinks() {
    const box = $('#pane-backlinks .pane-scroll'); box.innerHTML = '';
    const p = App.active?.path; if (!p || p.startsWith('graph:')) { box.append(h('div', { class: 'empty', text: 'Abra uma nota para ver os backlinks.' })); return; }
    const bl = this.backlinks(p); const groups = new Map(); bl.forEach(b => { if (!groups.has(b.from)) groups.set(b.from, []); groups.get(b.from).push(b); });
    box.append(h('div', { class: 'list-sec', html: icon('link') + `Menções vinculadas (${bl.length})` }));
    if (!bl.length) box.append(h('div', { class: 'empty', text: 'Nenhuma nota aponta para esta.' }));
    for (const [from, arr] of groups) {
      const f = h('div', { class: 'bl-file' }, h('div', { class: 'fn', html: icon('filetext') + esc(stemOf(from)), onclick: () => App.open(from) }));
      arr.forEach(b => f.append(h('div', { class: 'bl-snip', html: this.snippet(b.n.text, b.line), onclick: () => App.open(from, { line: b.line }) })));
      box.append(f);
    }
    if (extOf(p) !== 'md') return;
    const name = stemOf(p); if (name.length < 3) return;
    const re = new RegExp('(^|[^\\p{L}\\p{N}])' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![\\p{L}\\p{N}])', 'iu');
    const un = [];
    for (const [np, n] of App.notes) {
      if (np === p || groups.has(np)) continue;
      const lines = n.text.split('\n');
      lines.forEach((l, i) => { if (re.test(l) && !/\[\[[^\]]*$/.test(l.split(name)[0] || '')) un.push({ from: np, line: i, n }); });
    }
    box.append(h('div', { class: 'list-sec', style: { marginTop: '14px' }, html: icon('search') + `Menções não vinculadas (${un.length})` }));
    un.slice(0, 60).forEach(b => {
      const s = h('div', { class: 'bl-snip', html: '<b>' + esc(stemOf(b.from)) + '</b> — ' + this.snippet(b.n.text, b.line, name) });
      s.onclick = () => App.open(b.from, { line: b.line });
      const link = h('button', { class: 'btn sm', text: 'Vincular', style: { marginTop: '4px' }, onclick: async ev => { ev.stopPropagation(); await App.editNote(b.from, cur => { const lines = cur.split('\n'); if (lines[b.line] && re.test(lines[b.line])) lines[b.line] = lines[b.line].replace(re, (m, pre) => pre + '[[' + App.linkText(p) + ']]'); return lines.join('\n'); }); this.refresh(); } });
      s.append(h('div', {}, link)); box.append(s);

  },
  renderOutgoing() {
    const box = $('#pane-outgoing .pane-scroll'); box.innerHTML = '';
    const p = App.active?.path; const n = p && App.notes.get(p);
    if (!n) { box.append(h('div', { class: 'empty', text: 'Abra uma nota para ver os links de saída.' })); return; }
    const seen = new Set();
    n.links.forEach(l => {
      const r = App.resolve(l.target || p, p); const key = r || l.target; if (seen.has(key)) return; seen.add(key);
      box.append(h('div', { class: 'outline-item', style: { color: r ? '' : 'var(--unresolved)' }, html: icon(l.embed ? 'image' : 'link') + ' ' + esc(r ? (extOf(r) === 'md' ? stemOf(r) : baseOf(r)) : l.target + ' (não criada)'), onclick: () => r ? App.open(r) : App.createNote('', l.target) }));
    });
    if (!seen.size) box.append(h('div', { class: 'empty', text: 'Esta nota não tem links.' }));
  },
  outlineOpen: new Map(),
  renderOutline() {
    const pane = $('#pane-outline'); const box = pane.querySelector('.pane-scroll');
    let filt = pane.querySelector('.ol-filter');
    if (!filt) {
      filt = h('input', { class: 'txt ol-filter', placeholder: 'Filtrar (ex.: art 5, capítulo II)…', oninput: debounce(() => this.renderOutline(), 200) });
      pane.insertBefore(h('div', { class: 'search-box', style: { flexDirection: 'row', alignItems: 'center' } }, filt,
        h('button', { class: 'ib', title: 'Expandir tudo', html: icon('chevd'), onclick: () => { this.outlineOpen.set(App.active?.path, 'all'); this.renderOutline(); } }),
        h('button', { class: 'ib', title: 'Recolher tudo', html: icon('chevu'), onclick: () => { this.outlineOpen.set(App.active?.path, new Set()); this.renderOutline(); } })), box);
    }
    box.innerHTML = '';
    const v = App.active?.view; const p = App.active?.path;
    const text = v instanceof NoteView ? v.text : App.notes.get(p)?.text;
    if (text == null) { box.append(h('div', { class: 'empty', text: 'Abra uma nota para ver a estrutura.' })); return; }
    const { nodes, legal } = Lex.outline(text);
    if (!nodes.length) { box.append(h('div', { class: 'empty', text: 'Sem títulos nem estrutura de código nesta nota.' })); return; }
    /* monta a árvore */
    const root = { children: [], level: 0 }; const stack = [root];
    nodes.forEach(n => { const node = { ...n, children: [] }; while (stack.length > 1 && stack[stack.length - 1].level >= n.level) stack.pop(); stack[stack.length - 1].children.push(node); stack.push(node); });
    let open = this.outlineOpen.get(p); if (!open) { open = 'all'; this.outlineOpen.set(p, open); }
    const q = norm(filt.value.trim()).replace(/\bart\.?\s*/g, 'art. ').replace(/\s+/g, ' ');
    const match = n => !q || norm(n.text).replace(/\s+/g, ' ').includes(q) || (q.startsWith('art. ') && n.kind === 'art' && norm(n.text).startsWith(q.replace(/º/g, '')));
    const keep = n => { n.vis = match(n); n.children.forEach(c => { if (keep(c)) n.vis = true; }); return n.vis; };
    root.children.forEach(keep);
    const draw = (list, depth, parent) => list.forEach(n => {
      if (!n.vis) return;
      const has = n.children.some(c => c.vis); const isOpen = q || open === 'all' || (open instanceof Set && open.has(n.line));
      const row = h('div', { class: 'ol-row ol-' + n.kind + (legal && n.kind === 'struct' ? ' ol-l' + n.level : ''), style: { paddingLeft: (depth * 14 + 6) + 'px' } },
        h('span', { class: 'ol-chev' + (has ? '' : ' none') + (isOpen ? ' open' : ''), html: has ? icon('chev') : '', onclick: e => {
          e.stopPropagation(); let o = this.outlineOpen.get(p); if (o === 'all') { o = new Set(); const all = x => x.forEach(y => { if (y.children.length) o.add(y.line); all(y.children); }); all(root.children); }
          o.has(n.line) ? o.delete(n.line) : o.add(n.line); this.outlineOpen.set(p, o); this.renderOutline(); } }),
        h('span', { class: 'ol-text', text: n.text, title: n.text }));
      row.onclick = () => { const t = App.active; if (t?.view?.goto) t.view.goto({ line: n.line }); };
      parent.append(row);
      if (has && isOpen) draw(n.children, depth + 1, parent);
    });
    draw(root.children, 0, box);
    if (!box.children.length) box.append(h('div', { class: 'empty', text: 'Nada encontrado.' }));
  },
  allTags() { const m = new Map(); for (const n of App.notes.values()) n.tags.forEach(t => m.set(t, (m.get(t) || 0) + 1)); return m; },
  renderTags() {

  },
  renderBookmarks() {

/* ---------- Busca ---------- */
const Search = {
  run(q) { Layout.openSide('left'); Panels.showLeft('search'); const i = $('#search-in'); i.value = q; this.exec(); i.focus(); },
  exec: debounce(() => Search._exec(), 200),
  _exec() {
    const box = $('#search-res'); box.innerHTML = ''; const raw = $('#search-in').value.trim(); if (!raw) return;
    const cs = $('#search-case').checked, rx = $('#search-re').checked;
    const filters = { tag: [], path: [], file: [] }; const terms = [];
    raw.replace(/(tag|path|file):("[^"]+"|\S+)|"([^"]+)"|(\S+)/g, (m, k, v, ph, w) => { if (k) filters[k].push(v.replace(/"/g, '').replace(/^#/, '').toLowerCase()); else terms.push(ph || w); return ''; });
    let re = null;
    if (rx && terms.length) { try { re = new RegExp(terms.join(' '), cs ? 'g' : 'gi'); } catch (e) { box.append(h('div', { class: 'empty', text: 'Expressão regular inválida.' })); return; } }
    const N = s => cs ? s : norm(s); const T = terms.map(N);
    let total = 0, files = 0;
    const sorted = [...App.notes.values()].sort((a, b) => b.mtime - a.mtime);
    for (const n of sorted) {
      if (filters.path.length && !filters.path.every(f => n.path.toLowerCase().includes(f))) continue;
      if (filters.file.length && !filters.file.every(f => stemOf(n.path).toLowerCase().includes(f))) continue;
      if (filters.tag.length && !filters.tag.every(f => [...n.tags].some(t => t.toLowerCase() === f || t.toLowerCase().startsWith(f + '/')))) continue;
      const hits = [];
      if (re || T.length) {
        const lines = n.text.split('\n'); const nameHit = !re && T.every(t => N(stemOf(n.path)).includes(t));
        const allInFile = re ? re.test(n.text) : T.every(t => N(n.text).includes(t) || N(stemOf(n.path)).includes(t)); if (re) re.lastIndex = 0;
        if (!allInFile) continue;
        lines.forEach((l, i) => { if (re ? (re.lastIndex = 0, re.test(l)) : T.some(t => N(l).includes(t))) hits.push(i); });
        if (!hits.length && !nameHit) continue;
      }
      files++; total += hits.length;
      if (files > 300) continue;
      const f = h('div', { class: 'bl-file' }, h('div', { class: 'fn', html: icon('filetext') + esc(stemOf(n.path)) + `<span style="margin-left:auto;color:var(--faint);font-size:12px">${hits.length || ''}</span>`, onclick: () => App.open(n.path) }));
      hits.slice(0, 6).forEach(i => {
        let s = esc((n.text.split('\n')[i] || '').trim().slice(0, 240));
        if (re) s = s.replace(new RegExp(re.source, re.flags), m => '<mark>' + m + '</mark>');
        else terms.forEach(t => { const r = new RegExp('(' + esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', cs ? 'g' : 'gi'); s = s.replace(r, '<mark>$1</mark>'); });
        f.append(h('div', { class: 'bl-snip', html: s, onclick: () => App.open(n.path, { line: i }) }));
      });
      if (hits.length > 6) f.append(h('div', { class: 'bl-snip', style: { background: 'none' }, text: `+ ${hits.length - 6} ocorrências` }));
      box.append(f);
    }
    box.prepend(h('div', { class: 'list-sec', text: `${files} arquivo(s), ${total} ocorrência(s)` }));
  }
};

    box.append(h('div', { style: { marginTop: '24px', display: 'flex', gap: '8px', flexWrap: 'wrap' } }, h('button', { class: 'btn', html: icon('settings') + 'Configurações (Google e Gemini)', onclick: () => SettingsUI.open() }), App.vault ? h('button', { class: 'btn', text: 'Voltar ao cofre aberto', onclick: () => this.hide() }) : null));
    w.append(box);
  },
  hide() { $('#welcome').classList.add('hidden'); },
  async pickLocal() {
    try { const hd = await showDirectoryPicker({ id: 'codex-vault', mode: 'readwrite' }); let same = null; for (const r of Recent.list().filter(r => r.kind === 'local')) { const o = await KV.get('handle:' + r.id); if (o && await o.isSameEntry?.(hd)) { same = r.id; break; } } await App.openVault(new LocalVault(hd, same)); await Welcome.seedIfEmpty(); }
    catch (e) { if (e.name !== 'AbortError') UI.error(e); }
  },
  async pickDrive() {
    if (!Settings.get('googleClientId')) { SettingsUI.open('google'); return; }
    try { await DriveAuth.getToken(true); const f = await DrivePicker.open(); if (f) { await App.openVault(new DriveVault(f.id, f.name)); await Welcome.seedIfEmpty(); } }
    catch (e) { UI.error(e); }
  },
  async reopen(x) {
    try {
      if (x.kind === 'idb') return App.openVault(new IDBVault(x.name));
      if (x.kind === 'local') { const hd = await KV.get('handle:' + x.id); if (!hd) throw new Error('Pasta não encontrada; escolha-a de novo.'); return App.openVault(new LocalVault(hd, x.id)); }
      if (x.kind === 'drive') { await DriveAuth.getToken(false); return App.openVault(new DriveVault(x.rootId, x.name)); }
    } catch (e) { UI.error(e); }
  },
  async seedIfEmpty() {
    if (!App.vault || App.notes.size) return;
    const p = await App.createNote('', 'Bem-vindo ao Códex', WELCOME_MD, { open: false }); await App.open(p, { mode: 'live' });
  }
};
const WELCOME_MD = `# Bem-vindo ao Códex

Este cofre guarda notas em Markdown, compatíveis com o Obsidian.

## Primeiros passos
- Crie links entre notas com \`[[Nome da nota]]\`. Se a nota não existir, clicar no link a cria. Exemplo: [[Direito Civil]]
- Use tags como #estudo e #magistratura.
- ==Realce== com \`==texto==\`, tarefas com \`- [ ]\`:
- [ ] Ler o informativo da semana
- [x] Abrir o Códex

> [!dica] Atalhos
> ${MOD}+O abre qualquer arquivo · ${MOD}+P abre a paleta de comandos · ${MOD}+E alterna edição e leitura · ${MOD}+G abre o grafo.

## Anexos e PDFs
Cole um print com ${MOD}+V dentro da nota, ou arraste PDFs e imagens. Para incorporar: \`![[arquivo.pdf]]\` ou \`![[imagem.png|400]]\`. Vídeos do YouTube: \`![](https://youtu.be/...)\`.

## Escrever à mão
Abra um PDF e use a caneta (Apple Pencil com pressão). No menu “⋯” de qualquer nota, escolha “Transformar em caderno PDF” para escrever por cima dela. Para um caderno vazio, use o ícone de livro na barra à esquerda.

## Gemini
Abra o painel do Gemini (ícone de brilho) e informe sua chave nas Configurações.
`;

/* ---------- Seletor de pasta do Drive ---------- */
const DrivePicker = {
  open() {
    return new Promise(res => {
      const stack = [{ id: 'root', name: 'Meu Drive' }];
      const list = h('div', { class: 'pal-list', style: { maxHeight: '45vh', minHeight: '200px' } }); const crumb = h('div', { style: { fontSize: '13px', color: 'var(--muted)', margin: '0 0 8px', display: 'flex', flexWrap: 'wrap', gap: '4px' } });
      const link = h('input', { class: 'txt', placeholder: 'Ou cole aqui o link da pasta do Drive' });
      const body = h('div', {}, crumb, list, h('div', { style: { marginTop: '10px' } }, link));
      const load = async () => {
        crumb.innerHTML = ''; stack.forEach((s, i) => { crumb.append(h('a', { href: '#', style: { color: 'var(--link)' }, text: s.name, onclick: e => { e.preventDefault(); stack.splice(i + 1); load(); } })); if (i < stack.length - 1) crumb.append(' / '); });
        list.innerHTML = '<div class="empty">Carregando…</div>';
        try {
          const fs = await DriveVault.listFolders(stack[stack.length - 1].id); list.innerHTML = '';
          if (!fs.length) list.append(h('div', { class: 'empty', text: 'Nenhuma subpasta. Você pode usar esta pasta ou criar uma nova.' }));
          fs.forEach(f => list.append(h('div', { class: 'pal-item', html: icon('folder') + '<span class="main">' + esc(f.name) + '</span>', onclick: () => { stack.push(f); load(); } })));
        } catch (e) { list.innerHTML = ''; list.append(h('div', { class: 'empty', text: e.message })); }
      };
      UI.modal({
        title: 'Escolha a pasta do cofre no Google Drive', wide: true, body,
        buttons: [{ label: 'Cancelar', value: null },
        { label: 'Criar pasta aqui', value: () => { UI.prompt('Nome da nova pasta', 'Códex').then(async n => { if (!n) return; try { const f = await DriveVault.createFolder(stack[stack.length - 1].id, n); stack.push(f); load(); } catch (e) { UI.error(e); } }); return { __keep: true }; } },
        { label: 'Usar esta pasta', cls: 'pri', value: () => { const m = /folders\/([\w-]{10,})/.exec(link.value) || /^([\w-]{20,})$/.exec(link.value.trim()); return m ? { id: m[1], name: 'Pasta do Drive' } : (stack.length > 1 ? stack[stack.length - 1] : (UI.toast('Escolha ou crie uma pasta (não use a raiz do Drive).', true), { __keep: true })); } }]
      }).then(res);
      load();
    });
  }
};

/* ---------- Configurações ---------- */
const SettingsUI = {
  open(section) {
    const S = Settings; const body = h('div', {});
    const row = (label, sub, ctl) => h('div', { class: 'set-row' }, h('div', { class: 'lbl' }, h('b', { text: label }), sub ? h('small', { html: sub }) : null), h('div', { class: 'ctl' }, ctl));
    const sw = k => h('label', { class: 'switch' }, h('input', { type: 'checkbox', checked: S.get(k), onchange: e => { S.set(k, e.target.checked); S.apply(); AI.renderCtx(); } }), h('span'));
    const txt = (k, ph, type = 'text') => h('input', { class: 'txt', type, value: S.get(k), placeholder: ph || '', onchange: e => { S.set(k, type === 'number' ? +e.target.value : e.target.value.trim()); S.apply(); AI.renderCtx(); } });
    const sel = (k, opts) => h('select', { class: 'txt', onchange: e => { S.set(k, e.target.value); S.apply(); } }, ...opts.map(([v, l]) => h('option', { value: v, selected: S.get(k) === v }, l)));
    const sec = (id, t) => h('div', { class: 'set-sec', id: 'set-' + id, text: t });
    const modelWrap = h('div', {}); let showAll = false;
    const drawModels = () => { modelWrap.innerHTML = ''; modelWrap.append(AI.modelSelect(showAll),
      h('div', { style: { display: 'flex', gap: '8px', marginTop: '6px', alignItems: 'center', flexWrap: 'wrap' } },
        h('button', { class: 'btn sm', html: icon('refresh') + 'Atualizar lista', onclick: async () => { try { const l = await AI.refreshModels(true); drawModels(); UI.toast(l.length + ' modelos encontrados.'); } catch (e) { UI.error(e); } } }),
        h('label', { style: { fontSize: '12px', color: 'var(--muted)', display: 'flex', gap: '4px', alignItems: 'center' } }, h('input', { type: 'checkbox', checked: showAll, onchange: e => { showAll = e.target.checked; drawModels(); } }), 'mostrar modelos especiais'),
        h('span', { style: { fontSize: '12px', color: 'var(--faint)' }, text: AI.cachedModels() ? 'Lista de ' + new Date(AI.cachedModels().t).toLocaleString('pt-BR') : 'Lista ainda não carregada' }))); };
    drawModels(); if (S.get('geminiKey')) AI.refreshModels().then(drawModels).catch(() => { });
    body.append(
      sec('look', 'Aparência e editor'),
      row('Tema', '', sel('theme', [['dark', 'Escuro'], ['light', 'Claro'], ['system', 'Igual ao sistema']])),
      row('Modo ao abrir notas', '', sel('defaultMode', [['live', 'Edição unificada (texto já formatado)'], ['source', 'Código-fonte (mostra os códigos)'], ['read', 'Somente leitura']])),
      row('Alinhamento do texto', 'Vale para leitura, edição, cadernos em PDF e impressão. Não altera os arquivos.', sel('textAlign', [['justify', 'Justificado'], ['left', 'À esquerda']])),
      row('Justificar também durante a edição', 'Se no iPad as cores do editor ficarem desalinhadas do texto, desligue esta opção.', sw('justifyEditor')),
      row('Fonte do texto das notas', 'Fonte geral do editor e da leitura (a interface não muda).', sel('textFont', FONTS.map(([v, l]) => [v, l]))),
      row('Mostrar barra de formatação', 'Negrito, cores, fontes, alinhamento etc. acima do editor', sw('showFormatBar')),
      row('Tamanho da fonte', 'Em pixels', txt('editorSize', '16', 'number')),
      row('Largura de leitura confortável', 'Limita a largura do texto', sw('readable')),
      row('Editor com fonte monoespaçada', '', sw('monoEditor')),
      row('Corretor ortográfico', 'Do navegador', sw('spellcheck')),
      sec('files', 'Arquivos'),
      row('Pasta de anexos', 'Imagens coladas e arquivos arrastados vão para cá. Use <code>./</code> para a mesma pasta da nota.', txt('attachFolder', 'Anexos')),
      row('Pasta dos comentários a dispositivos', 'Cada comentário a um artigo, parágrafo ou inciso vira uma nota nesta pasta, numa subpasta com o nome da lei.', txt('commentsFolder', 'Comentários')),
      row('Pasta das notas diárias', '', txt('dailyFolder', 'Diário')),
      row('Formato do nome da nota diária', 'YYYY, MM, DD', txt('dailyFormat', 'YYYY-MM-DD')),
      row('Modelo da nota diária', 'Caminho ou nome de uma nota (opcional)', txt('dailyTemplate', 'Modelos/Diário')),
      row('Pasta de modelos', 'Variáveis: {{date}}, {{time}}, {{title}}', txt('templatesFolder', 'Modelos')),
      sec('google', 'Google Drive'),
      row('Client ID do OAuth', 'Criado no Google Cloud Console (tipo “Aplicativo da Web”). A origem JavaScript autorizada deve ser o endereço onde este arquivo está publicado: <code>' + esc(location.origin) + '</code>', txt('googleClientId', '1234…apps.googleusercontent.com')),
      sec('gemini', 'Gemini'),
      row('Chave da API', 'Fica guardada só neste navegador. Obtenha em aistudio.google.com', (() => { const i = txt('geminiKey', 'AIza…', 'password'); i.addEventListener('change', () => AI.refreshModels(true).then(drawModels).catch(e => UI.error(e))); return i; })()),
      row('Modelo', 'A lista vem da sua conta no Google e se atualiza sozinha a cada 6 horas. As opções “Automático” passam a usar o modelo mais novo assim que o Google o lança.', modelWrap),
      row('Meu projeto tem faturamento ativo (nível pago)', 'No nível pago o Google não usa o conteúdo para aprimorar produtos. Marcar isto apenas remove o aviso: confira o seu projeto em aistudio.google.com.', sw('geminiPaid')),
      row('Permitir que o Gemini altere o cofre', 'Criar, editar, mover e renomear notas. Cada alteração pede sua confirmação.', sw('geminiAgent')),
      row('Instruções adicionais', 'Acrescentadas às instruções do sistema (estilo, formatação, preferências).', (() => { const t = h('textarea', { class: 'txt', rows: 4, placeholder: 'Ex.: Use prosa dissertativa, sem negrito; datas em d/m/aaaa; valores em algarismos e por extenso, sem símbolo de moeda.' }); t.value = S.get('geminiExtra'); t.onchange = () => S.set('geminiExtra', t.value); return t; })()),
      sec('pen', 'Anotador de PDF'),
      row('Só caneta (Apple Pencil)', 'O dedo rola a página e só a caneta escreve. Evita riscos com a palma da mão.', sw('penOnly')),
      sec('vault', 'Cofre'),
      row('Cofre atual', App.vault ? esc(App.vault.name) + ' — ' + (App.vault.kind === 'drive' ? 'Google Drive' : App.vault.kind === 'local' ? 'pasta do computador' : 'navegador') : 'nenhum', h('div', { style: { display: 'flex', gap: '6px', flexWrap: 'wrap' } }, h('button', { class: 'btn sm', text: 'Trocar de cofre', onclick: () => { body.closest('.modal')._close?.(null); Welcome.show(); } }), App.vault ? h('button', { class: 'btn sm', text: 'Sincronizar', onclick: () => Shell.reloadVault() }) : null))
    );
    UI.modal({ title: 'Configurações', wide: true, body, buttons: [{ label: 'Fechar', cls: 'pri', value: true }], onClose: () => { App.tabs.forEach(t => { if (t.view instanceof NoteView && t.view.cmHost) { t.view.cmHost.classList.toggle('mono', Settings.get('monoEditor')); t.view.cm.contentDOM.setAttribute('spellcheck', Settings.get('spellcheck') ? 'true' : 'false'); } }); AI.renderCtx(); if (!$('#welcome').classList.contains('hidden')) Welcome.show(); } });
    if (section) setTimeout(() => $('#set-' + section)?.scrollIntoView({ block: 'start' }), 60);
  }
};
